<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --bg-page: #F7F9FA;
    --border: #D1D7DC;
    --border-dark: #9CA3AF;
    --text: #1C1D1F;
    --sec: #6A6F73;
    --accent: #3B5BA9;
    --accent-dark: #2C4480;
    --accent-light: #EAF0FB;
    --purple: #5624D0;
    --ok: #1e7e34;
    --err: #c0392b;
    --warn: #92400E;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; padding-top: 52px; }

  /* Topbar */
  .mba-topbar { position:fixed; top:0; left:0; right:0; z-index:9990; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:52px; }
  .mba-topbar-left { display:flex; align-items:center; gap:16px; min-width:0; }
  .mba-topbar-back { display:flex; align-items:center; gap:6px; font-size:0.82rem; font-weight:700; color:var(--text); text-decoration:none; white-space:nowrap; }
  .mba-topbar-back:hover { color:var(--purple); }
  .mba-topbar-divider { width:1px; height:20px; background:var(--border); }
  .mba-topbar-title { font-size:0.85rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mba-topbar-right { display:flex; align-items:center; gap:12px; }
  .mba-topbar-group { font-size:0.78rem; color:var(--sec); }
  .mba-topbar-group strong { color:var(--text); font-weight:700; }
  .mba-topbar-logout { font-size:0.75rem; font-weight:600; color:var(--purple); cursor:pointer; background:none; border:none; font-family:inherit; }
  .mba-topbar-logout:hover { text-decoration:underline; }

  /* Language switch */
  .lang-switch { display:inline-flex; border:1.5px solid var(--border); }
  .lang-switch button { background:#fff; border:none; padding:5px 10px; font-family:inherit; font-size:0.72rem; font-weight:700; letter-spacing:0.06em; color:var(--sec); cursor:pointer; }
  .lang-switch button + button { border-left:1.5px solid var(--border); }
  .lang-switch button.active { background:var(--text); color:#fff; }
  .gate-box .lang-switch-slot { display:flex; justify-content:flex-end; margin:-28px -20px 16px 0; }
  body.lang-fixed .mba-topbar .lang-switch-slot { display:none; }

  /* Gate */
  #mba-group-gate { position:fixed; inset:0; background:#fff; z-index:9999; display:flex; align-items:center; justify-content:center; }
  .gate-box { background:#fff; border:1.5px solid var(--border); padding:48px 40px; max-width:420px; width:90%; }
  .gate-eyebrow { font-size:11px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:#9b8f84; margin-bottom:12px; }
  .gate-box h2 { font-size:1.6rem; font-weight:800; margin-bottom:8px; }
  .gate-box p { color:var(--sec); margin-bottom:24px; font-size:0.9rem; line-height:1.55; }
  .gate-input { width:100%; padding:13px 14px; border:1.5px solid var(--border); font-size:1rem; font-family:inherit; outline:none; margin-bottom:10px; }
  .gate-input:focus { border-color:var(--accent); }
  .gate-error { font-size:0.82rem; color:var(--err); margin-bottom:10px; min-height:18px; }
  .gate-btn { width:100%; padding:13px; background:var(--accent); color:#fff; border:none; font-size:0.95rem; font-weight:700; font-family:inherit; cursor:pointer; }
  .gate-btn:hover { background:var(--accent-dark); }
  .gate-btn:disabled { opacity:0.6; cursor:not-allowed; }

  /* Progress */
  .progress-wrap { background:#fff; border-bottom:1px solid var(--border); padding:14px 24px; position:sticky; top:52px; z-index:100; display:none; }
  .progress-wrap.on { display:block; }
  .progress-meta { display:flex; justify-content:space-between; gap:12px; font-size:0.8rem; color:var(--sec); margin-bottom:8px; flex-wrap:wrap; }
  .progress-meta strong { color:var(--text); }
  .progress-bar { height:4px; background:var(--border); border-radius:2px; }
  .progress-fill { height:100%; background:var(--accent); border-radius:2px; transition:width 0.3s; }

  /* Layout */
  .container { max-width:780px; margin:0 auto; padding:40px 24px 80px; }
  .container.wide { max-width:1120px; padding-top:24px; }
  .grid { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:20px; align-items:start; }
  .grid.single { grid-template-columns:minmax(0,1fr); }
  .grid.single .case { display:none; }
  .card { background:#fff; border:1.5px solid var(--border); padding:32px; margin-bottom:20px; }
  .grid .card { margin-bottom:0; }
  .case { position:sticky; top:124px; max-height:calc(100vh - 140px); overflow:auto; padding:24px; }
  @media (max-width:860px) { .grid { grid-template-columns:1fr; } .case { position:static; max-height:none; } }

  .eyebrow { font-size:11px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--sec); margin-bottom:12px; }
  h1.page-title { font-size:1.9rem; font-weight:900; margin-bottom:14px; letter-spacing:-0.02em; }
  .card h2 { font-size:1.1rem; font-weight:800; margin-bottom:12px; }
  .card h3 { font-size:1rem; font-weight:800; margin:20px 0 10px; }
  .card p { color:var(--sec); line-height:1.65; margin-bottom:14px; font-size:0.92rem; }
  .step-title { font-size:1.4rem !important; font-weight:900 !important; letter-spacing:-0.01em; margin-bottom:8px !important; }
  .prompt { color:var(--sec); line-height:1.6; margin-bottom:18px; font-size:0.95rem; }
  .note { font-size:0.84rem; color:var(--sec); line-height:1.55; margin-top:4px; }

  /* Case column */
  .case h2 { font-size:1.15rem; font-weight:800; margin-bottom:10px; }
  .case p { color:var(--text); font-size:0.9rem; line-height:1.6; margin-bottom:12px; }
  .case ul { margin:0 0 12px 20px; font-size:0.9rem; line-height:1.6; }
  .tablewrap { overflow-x:auto; margin:0 0 14px; }
  table { border-collapse:collapse; width:100%; font-size:0.86rem; }
  th, td { padding:7px 10px; border-bottom:1px solid var(--border); text-align:left; }
  th { font-weight:700; color:var(--sec); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  blockquote { margin:0 0 12px; padding:10px 14px; border-left:3px solid var(--accent); background:var(--accent-light); color:var(--accent-dark); font-size:0.88rem; line-height:1.55; }

  /* Timer */
  .timer { display:flex; align-items:center; gap:14px; margin:0 0 18px; }
  .tnum { font-size:1.5rem; font-weight:800; min-width:4.2ch; font-variant-numeric:tabular-nums; }
  .bar { flex:1; height:8px; background:var(--border); overflow:hidden; }
  .bar i { display:block; height:100%; width:100%; background:var(--accent); }
  .timer.urgent .tnum { color:var(--err); }
  .timer.urgent .bar i { background:var(--err); }

  /* Options */
  .opts { display:grid; gap:8px; }
  .opt { display:block; width:100%; text-align:left; font:inherit; font-size:0.92rem; color:inherit; background:#fff; border:1.5px solid var(--border); padding:12px 16px; cursor:pointer; line-height:1.45; }
  .opt:hover { border-color:var(--accent); }
  .opt[aria-checked="true"] { border-color:var(--accent); background:var(--accent-light); color:var(--accent-dark); font-weight:600; }
  .opt:focus-visible, .btn:focus-visible, .ofzb:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .counter { font-size:0.8rem; color:var(--sec); margin:0 0 8px; font-variant-numeric:tabular-nums; }
  .ofzrow { display:grid; grid-template-columns:1fr auto; gap:8px 14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); font-size:0.92rem; line-height:1.45; }
  .ofzrow:last-child { border-bottom:none; }
  .ofzgrp { display:flex; gap:6px; }
  .ofzb { font:inherit; font-weight:800; width:44px; height:40px; border:1.5px solid var(--border); background:#fff; color:var(--text); cursor:pointer; }
  .ofzb:hover { border-color:var(--accent); }
  .ofzb[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:480px) { .ofzrow { grid-template-columns:1fr; } }
  .legend { font-size:0.84rem; color:var(--sec); margin:0 0 8px; line-height:1.5; }

  /* Buttons */
  .btn { padding:12px 24px; font-size:0.9rem; font-weight:700; font-family:inherit; cursor:pointer; border:none; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent-dark); }
  .btn-ghost { background:#fff; color:var(--text); border:1.5px solid var(--border); }
  .btn-ghost:hover { background:var(--bg-page); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-row { display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin-top:24px; }

  /* Forms */
  .field-label { font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--sec); display:block; margin-bottom:6px; }
  .text-input, select.text-input { width:100%; padding:12px 14px; border:1.5px solid var(--border); font-size:0.95rem; font-family:inherit; outline:none; background:#fff; color:var(--text); }
  .text-input:focus { border-color:var(--accent); }
  .field-err { font-size:0.82rem; color:var(--err); margin-top:6px; min-height:18px; }
  .rules { margin:0 0 20px 20px; font-size:0.92rem; line-height:1.65; color:var(--text); }
  .rules li { margin:4px 0; }
  .form-row { margin-top:18px; }

  /* Learn screen */
  .defs { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:0 0 18px; }
  .def { border:1.5px solid var(--border); padding:16px; }
  .def h3 { margin:0 0 8px; font-size:0.95rem; display:flex; gap:8px; align-items:center; }
  .def p { margin:0 0 8px; font-size:0.86rem; }
  .def .ex { color:var(--accent-dark); background:var(--accent-light); padding:6px 10px; }
  .def .q { margin:0; font-size:0.82rem; }
  .letter { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; background:var(--accent); color:#fff; font-size:0.8rem; font-weight:800; flex-shrink:0; }
  .note-box { background:var(--accent-light); border-left:3px solid var(--accent); padding:14px 18px; margin:16px 0; font-size:0.86rem; line-height:1.6; color:var(--accent-dark); }
  .warm { border:1.5px dashed var(--border-dark); padding:16px 18px; margin:18px 0 0; }
  .warm h3 { margin:0 0 6px; }
  .fb { font-size:0.84rem; margin:6px 0 0; color:var(--sec); line-height:1.5; }
  .fb.ok { color:var(--ok); }
  .fb.bad { color:var(--err); }

  /* Results */
  .stage { padding:18px 0; border-bottom:2px solid var(--border); }
  .stage:last-of-type { border-bottom:none; }
  .stage > h3 { margin:0 0 10px; font-size:1.05rem; }
  .scen { margin:12px 0; padding:16px 18px; border:1.5px solid var(--border); }
  .scen > h4 { margin:0 0 6px; font-size:0.98rem; font-weight:800; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sumrow { padding:10px 0; border-bottom:1px solid var(--border); font-size:0.88rem; line-height:1.5; }
  .sumrow:last-child { border-bottom:none; }
  .sumrow h5 { margin:0 0 2px; font-size:0.88rem; font-weight:700; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sumrow .tm { font-size:0.75rem; color:var(--sec); font-variant-numeric:tabular-nums; }
  .sumrow ul { margin:4px 0 0 20px; }
  .pill { display:inline-block; font-size:0.72rem; font-weight:800; padding:2px 8px; background:var(--accent-light); color:var(--accent-dark); font-variant-numeric:tabular-nums; }
  .pill.p2 { background:#EAF5EF; color:#1F5A41; }
  .pill.p1 { background:#FFFBEB; color:var(--warn); }
  .pill.p0 { background:#FDF0EE; color:#8E2A1F; }
  .unlock { margin-top:14px; padding:16px 18px; border:1.5px dashed var(--border-dark); background:#fff; }
  .unlock-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0 6px; }
  .unlock-row .text-input { flex:1; min-width:160px; width:auto; }
  .total { font-size:1.15rem; font-weight:800; font-variant-numeric:tabular-nums; margin-top:10px; }
  .grand { background:var(--text); color:#fff; padding:24px 28px; margin:16px 0 0; font-size:1.4rem; font-weight:900; }
  textarea.copy-ta { width:100%; min-height:200px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:0.8rem; border:1.5px solid var(--border); padding:8px; margin-top:8px; }

  @media (max-width:640px) {
    .card, .gate-box { padding:28px 20px; }
    .case { padding:20px; }
    .container { padding:24px 16px 80px; }
    .progress-wrap { padding:12px 16px; }
  }
  @media (max-width:600px) {
    .mba-topbar { padding:0 16px; }
    .mba-topbar-group { display:none !important; }
    .mba-topbar-divider, .mba-topbar-title { display:none; }
  }
</style>

<script>
(function(){

    var s = JSON.parse(sessionStorage.getItem(SK));
    if (s && s.password) {
      var style = document.createElement('style');
      style.textContent = '#mba-group-gate{display:none!important}';

        var inp = document.getElementById('mba-gate-input');

        else style.remove();
      });
    }
  } catch(e){}
})();
</script>

 caseHtml:'<h2>Opóźnione wdrożenie</h2><p>Firma wdraża system do obsługi zamówień. Termin końca wdrożenia: 30 listopada. Dziś jest 3 listopada, a dostawca zgłasza 3 tygodnie opóźnienia względem planu. Stan modułów:</p><div class="tablewrap"><table><thead><tr><th>Status</th><th class="num">Moduły</th></tr></thead><tbody><tr><td>Gotowe i przetestowane</td><td class="num">14</td></tr><tr><td>Gotowe, do przetestowania</td><td class="num">2</td></tr><tr><td>W trakcie</td><td class="num">3</td></tr><tr><td>Niezaczęte</td><td class="num">1</td></tr></tbody></table></div><p>Opcje:</p><ul><li>A: dodać 2 programistów od dostawcy, koszt 48 000 zł. Dostawca szacuje, że dzięki temu zdąży w terminie.</li><li>B: przesunąć termin o 3 tygodnie, kara umowna 10 000 zł.</li></ul><blockquote>Dostawca: „Opóźnienie wynika ze zmian wymagań po stronie firmy.”</blockquote><blockquote>Kierownik IT: „To na pewno wina dostawcy. Od początku mieli za mało ludzi.”</blockquote><p>Zarząd decyduje w piątek.</p>',
 teza:[

  {id:'t2',text:'Dodać 2 programistów za 48 000 zł, żeby zdążyć w terminie.',pts:1,note:'Brak informacji, że termin jest twardy. Efekt to deklaracja dostawcy.'},
  {id:'t3',text:'Najpierw ustalić, kto zawinił, a potem zdecydować.',pts:0,note:'Przyczyna nie jest potrzebna do decyzji w piątek.'},
  {id:'t4',text:'Zmienić dostawcę.',pts:0,note:'Poza opcjami i bez danych.'},
  {id:'t5',text:'Przyjąć wersję kierownika IT i obciążyć dostawcę kosztami.',pts:0,note:'Hipoteza podana jak fakt.',flag:'autorytet'},
  {id:'t6',text:'Przesunąć termin i zażądać od dostawcy pokrycia kary.',pts:1,note:'Dobra decyzja, ale roszczenie opiera się na niewykazanej winie.'},
  {id:'t7',text:'Zostawić termin bez zmian i czekać.',pts:0,note:'Brak decyzji.'},
  {id:'t8',text:'Zapytać kierownika IT, którą opcję woli, i zrobić jak on.',pts:0,note:'Dopasowanie do autorytetu.',flag:'autorytet'}],

{title:'Efekt programu rozwoju',
 caseHtml:'<h2>Efekt programu rozwoju</h2><p>Firma przeprowadziła 6-miesięczny program rozwoju dla 30 handlowców. Grupa porównawcza: 30 handlowców bez programu, o podobnym stażu i w podobnych regionach. Miernik: średnia miesięczna sprzedaż na osobę (tys. zł).</p><div class="tablewrap"><table><thead><tr><th>Grupa</th><th class="num">Osoby</th><th class="num">Przed</th><th class="num">Po</th></tr></thead><tbody><tr><td>Program</td><td class="num">30</td><td class="num">80</td><td class="num">92</td></tr><tr><td>Porównawcza</td><td class="num">30</td><td class="num">80</td><td class="num">88</td></tr></tbody></table></div><p>Koszt programu: 90 000 zł (3 000 zł na osobę). Zarząd pyta o rozszerzenie na 150 handlowców (ok. 450 000 zł).</p><blockquote>Dyrektor HR: „Sprzedaż wzrosła o 15%, więc program się opłacił.”</blockquote><blockquote>Szef sprzedaży: „Handlowcy bardzo go chwalą.”</blockquote><p>Zarząd decyduje w czwartek.</p>',
 teza:[
  {id:'t1',text:'Rozszerzyć program na 150 osób, bo sprzedaż wzrosła o 15%.',pts:0,note:'Całość wzrostu przypisana programowi, choć grupa porównawcza też wzrosła.'},
  {id:'t2',text:'Nie rozszerzać, zanim ktoś oszacuje, ile jest warta różnica 4 tys. zł sprzedaży miesięcznie.',pts:2,note:'Zgodne z kluczem: efekt netto jest, wartość nieznana.'},
  {id:'t3',text:'Rozszerzyć na część handlowców jako kolejny test z grupą porównawczą.',pts:2,note:'Obronne: ogranicza koszt i sprawdza, czy efekt się powtarza.'},
  {id:'t4',text:'Nie rozszerzać, bo program nie działa.',pts:0,note:'Efekt netto jest dodatni (4 tys. zł na osobę), więc to nadinterpretacja.'},
  {id:'t5',text:'Rozszerzyć, bo handlowcy go chwalą.',pts:0,note:'Opinia uczestników zamiast wyniku.',flag:'autorytet'},
  {id:'t6',text:'Poprosić o więcej danych, zanim cokolwiek zaproponuję.',pts:0,note:'Analiza zamiast wniosku.'},
  {id:'t7',text:'Rozszerzyć, bo wzrost w grupie programu (12 tys.) jest większy niż w porównawczej (8 tys.).',pts:1,note:'Poprawne porównanie, ale bez marży i trwałości efektu wniosek jest za mocny.'},
  {id:'t8',text:'Zapytać dyrektor HR, jak ocenia program, i przyjąć jej zdanie.',pts:0,note:'Dopasowanie do autorytetu.',flag:'autorytet'}],
 fakty:[
  {id:'f1',text:'W grupie programu sprzedaż na osobę wzrosła o 12 tys. zł, w porównawczej o 8 tys. zł.',k:'K'},
  {id:'f2',text:'Efekt netto programu to ok. 4 tys. zł sprzedaży miesięcznie na osobę.',k:'K'},
  {id:'f3',text:'Program kosztuje 3 000 zł na osobę, rozszerzenie ok. 450 000 zł.',k:'K'},
  {id:'f4',text:'Grupa porównawcza też wzrosła, więc część wzrostu nie pochodzi z programu.',k:'K'},
  {id:'f5',text:'Wzrost sprzedaży w grupie programu wyniósł 15%.',k:'N'},

  {id:'f7',text:'Program się opłacił.',k:'T'},
  {id:'f8',text:'Wynik dotyczy sprzedaży, nie marży.',k:'K'}],
 nFakty:'Kluczowe: wzrost w obu grupach, efekt netto 4 tys. zł, koszt, sprzedaż to nie marża. Pułapki: opinia uczestników i wniosek dyrektor HR.',

  {id:'s1',text:'W grupie porównawczej sprzedaż wzrosła z 80 do 88 tys. zł na osobę.',key:'F'},

  {id:'s3',text:'Efekt programu utrzyma się po jego zakończeniu.',key:'Z'},

  {id:'s5',text:'Handlowcy bardzo chwalą program.',key:'O'},
  {id:'s6',text:'Na 150 osobach efekt będzie taki sam jak na 30.',key:'Z'},
  {id:'s7',text:'W grupie programu sprzedaż wzrosła z 80 do 92 tys. zł na osobę.',key:'F'},
  {id:'s8',text:'Cała różnica między grupami wynika z programu.',key:'Z'}],

  {id:'b1',text:'Marża na sprzedaży (ile z 4 tys. zł zostaje firmie).',ok:true},

  {id:'b3',text:'Jak dobrano grupę porównawczą i czy była naprawdę porównywalna.',ok:true},

  {id:'b5',text:'Ilu handlowców dyrektor HR zna osobiście.',ok:false},

{title:'Licencje na narzędzie',
 caseHtml:'<h2>Licencje na narzędzie</h2><p>Dział kupuje roczną licencję na narzędzie do zarządzania projektami.</p><ul><li>Cena: 120 zł za użytkownika miesięcznie.</li><li>Zniżka 10% przy zamówieniu powyżej 40 użytkowników.</li><li>Budżet roczny: 60 000 zł.</li><li>Dział IT szacuje, że będzie z niego korzystać 35 osób. Dział HR szacuje 45 osób. Nikt nie sprawdził listy w systemie kadrowym.</li><li>Dostawca trzyma ofertę do piątku.</li></ul><blockquote>Dyrektor operacyjny: „Zamów na 45 osób, lepiej mieć zapas.”</blockquote>',

{title:'Opis oferty na stronie',
 caseHtml:'<h2>Opis oferty na stronie</h2><p>Mała agencja badawcza (4 osoby) zmieniła opis oferty na swojej stronie trzy razy w pięć tygodni, za każdym razem po radzie innej osoby. Dane miesięczne po każdej zmianie:</p><div class="tablewrap"><table><thead><tr><th>Wersja</th><th>Zmiana (czyja rada)</th><th class="num">Odwiedziny</th><th class="num">Zapytania</th></tr></thead><tbody><tr><td>Wyjściowa</td><td>brak</td><td class="num">400</td><td class="num">4</td></tr><tr><td>1</td><td>Krótszy opis (klient)</td><td class="num">380</td><td class="num">5</td></tr><tr><td>2</td><td>Dodane certyfikaty (kolega z branży)</td><td class="num">410</td><td class="num">3</td></tr><tr><td>3</td><td>Więcej zdjęć (grafik)</td><td class="num">390</td><td class="num">4</td></tr></tbody></table></div><blockquote>Klientka z grupy docelowej: „Kupuję takie usługi od lat. Zmieńcie nagłówek na pytanie do klienta, wtedy kliknę.”</blockquote><p>Właścicielka decyduje do poniedziałku, czy wprowadzić czwartą zmianę.</p>',
 teza:[
  {id:'t1',text:'Wprowadzić czwartą zmianę, bo radzi ją klientka z grupy docelowej.',pts:0,note:'Autorytet grupy docelowej wzięty za dowód.',flag:'autorytet'},
  {id:'t2',text:'Nie wprowadzać czwartej zmiany. Zostawić jedną wersję na 8 tygodni i mierzyć zapytania.',pts:2,note:'Zgodne z kluczem: zmiany były szumem, potrzeba dłuższej próby.'},
  {id:'t3',text:'Wrócić do wersji 1, bo dała najwięcej zapytań (5).',pts:1,note:'Decyzja odwracalna, ale różnica 1 zapytania to szum.'},
  {id:'t4',text:'Przetestować czwartą zmianę równolegle z wersją 1 (test A/B).',pts:1,note:'Kierunek dobry, ale 400 odwiedzin miesięcznie to za mało na test.'},
  {id:'t5',text:'Zmienić opis jeszcze raz według rad wszystkich czterech osób naraz.',pts:0,note:'Nie da się ustalić, co zadziałało.'},
  {id:'t6',text:'Zapytać więcej osób o opinię o stronie, zanim zdecyduję.',pts:0,note:'Kolejne rady zamiast decyzji.'},
  {id:'t7',text:'Usunąć certyfikaty, bo dały najgorszy wynik (3 zapytania).',pts:0,note:'Różnica 1 do 2 zapytań to szum.'},
  {id:'t8',text:'Zapytać kolegę z branży, co sądzi o czwartej zmianie.',pts:0,note:'Dopasowanie do autorytetu.',flag:'autorytet'}],
 fakty:[
  {id:'f1',text:'Cztery wersje opisu dały od 3 do 5 zapytań miesięcznie.',k:'K'},

{title:'Wybór kandydata',
 caseHtml:'<h2>Wybór kandydata</h2><p>Zespół analityczny szuka analityka. Budżet na wynagrodzenie: 14 000 zł brutto miesięcznie. Projekt startuje za 6 tygodni i potrzebna jest osoba pracująca od startu.</p><div class="tablewrap"><table><thead><tr><th>Kandydat</th><th class="num">Doświadczenie</th><th class="num">Zadanie (pkt/100)</th><th class="num">Referencje</th><th class="num">Oczekiwania</th><th>Start pracy</th></tr></thead><tbody><tr><td>A</td><td class="num">8 lat</td><td class="num">72</td><td class="num">0 z 3</td><td class="num">16 000 zł</td><td>od zaraz</td></tr><tr><td>B</td><td class="num">4 lata</td><td class="num">88</td><td class="num">3 z 3</td><td class="num">13 000 zł</td><td>za 8 tygodni</td></tr><tr><td>C</td><td class="num">6 lat</td><td class="num">81</td><td class="num">1 z 3</td><td class="num">14 000 zł</td><td>za 5 tygodni</td></tr></tbody></table></div><blockquote>Kierownik zespołu: „Kandydat A zrobił na mnie najlepsze wrażenie. Widać, że to ktoś z klasą.”</blockquote><p>Decyzja do środy.</p>',
 teza:[
  {id:'t1',text:'Wybrać A, bo zrobił najlepsze wrażenie na kierowniku.',pts:0,note:'Wrażenie jako argument. A ma najniższy wynik zadania i przekracza budżet.',flag:'autorytet'},
  {id:'t2',text:'Wybrać C: mieści się w budżecie i w terminie startu. Dopytać o pozostałe 2 referencje.',pts:2,note:'Zgodne z kluczem: spełnia oba twarde warunki, ryzyko wskazane.'},
  {id:'t3',text:'Wybrać B: najlepszy wynik zadania i pełne referencje, a start przesunąć o 2 tygodnie.',pts:1,note:'Mocne dane, ale łamie warunek startu. Wymaga potwierdzenia, że projekt zniesie 2 tygodnie.'},
  {id:'t4',text:'Wybrać A i wynegocjować pensję w dół do 14 000 zł.',pts:0,note:'Założenie, że A się zgodzi.'},
  {id:'t5',text:'Wybrać kandydata z najdłuższym doświadczeniem, czyli A.',pts:0,note:'Doświadczenie jedyną miarą, przy ignorowaniu budżetu i wyniku zadania.'},
  {id:'t6',text:'Poprosić o dodatkową rozmowę ze wszystkimi trzema, zanim zdecyduję.',pts:0,note:'Dane wystarczają na wniosek z ryzykiem, a decyzja jest w środę.'},
  {id:'t7',text:'Wybrać B, bo ma najlepsze referencje i wynik, a termin startu to szczegół.',pts:0,note:'Twardy warunek uznany za szczegół.'},
  {id:'t8',text:'Zapytać kierownika, kogo woli, i się z nim zgodzić.',pts:0,note:'Dopasowanie do autorytetu.',flag:'autorytet'}],
 fakty:[
  {id:'f1',text:'Kandydat A oczekuje 16 000 zł, a budżet to 14 000 zł.',k:'K'},
  {id:'f2',text:'Kandydat B może zacząć za 8 tygodni, a projekt startuje za 6.',k:'K'},
  {id:'f3',text:'Kandydat C: 14 000 zł, start za 5 tygodni, zadanie 81 punktów.',k:'K'},
  {id:'f4',text:'Kandydat B ma najlepszy wynik zadania (88) i 3 z 3 potwierdzone referencje.',k:'K'},
  {id:'f5',text:'Kandydat A ma najniższy wynik zadania (72) i 0 z 3 potwierdzonych referencji.',k:'K'},
  {id:'f6',text:'Kandydat A ma najdłuższe doświadczenie (8 lat).',k:'N'},
  {id:'f7',text:'Kandydat A zrobił najlepsze wrażenie.',k:'T'},
  {id:'f8',text:'Kandydat A to ktoś z klasą.',k:'T'}],
 nFakty:'Kluczowe: budżet, termin startu, wyniki zadań, referencje. Pułapki: wrażenie kierownika i „klasa” kandydata.',
 ofz:[
  {id:'s1',text:'Kandydat C ma potwierdzoną 1 z 3 referencji.',key:'F'},
  {id:'s2',text:'Kandydat A zrobił najlepsze wrażenie.',key:'O'},
  {id:'s3',text:'Pozostałe referencje kandydata C będą dobre.',key:'Z'},
  {id:'s4',text:'Kandydat B zrobił zadanie na 88 punktów.',key:'F'},
  {id:'s5',text:'Kandydat A to ktoś z klasą.',key:'O'},
  {id:'s6',text:'Kandydat A zgodzi się na 14 000 zł.',key:'Z'},
  {id:'s7',text:'Projekt startuje za 6 tygodni.',key:'F'},
  {id:'s8',text:'Kandydat B skróci okres wypowiedzenia.',key:'Z'}],
 braki:[
  {id:'b1',text:'Wyniki sprawdzenia pozostałych dwóch referencji kandydata C.',ok:true},
  {id:'b2',text:'Czy projekt może ruszyć bez analityka przez 2 tygodnie.',ok:true},
  {id:'b3',text:'Czy kandydat B może skrócić okres wypowiedzenia.',ok:true},
  {id:'b4',text:'Jak kandydaci ubrali się na rozmowę.',ok:false},
  {id:'b5',text:'Jakie hobby ma kandydat A.',ok:false},
  {id:'b6',text:'Co kierownik zespołu pamięta z rozmowy z kandydatem A.',ok:false}],
 nBraki:'Trafne braki: reszta referencji C, tolerancja projektu na opóźnienie startu, skrócenie wypowiedzenia B.',
 p:{who:'Kierownik zespołu',text:'Prowadzę rekrutacje od 12 lat. Jak widzę dobrego kandydata, to wiem. Bierz A, resztę dogadamy.',claim:'Kierownik wie, kto jest dobry'}
}
],
en: [
/* 1 */
{title:'Campaign channels',
 caseHtml:'<h2>Campaign channels</h2><p>A training company has PLN 30,000 for a Q4 campaign. Target: 12 contracts. The sales director asks how to split the budget. Data from the previous quarter:</p><div class="tablewrap"><table><thead><tr><th>Channel</th><th class="num">Cost</th><th class="num">Enquiries</th><th class="num">Contracts</th></tr></thead><tbody><tr><td>LinkedIn Ads</td><td class="num">PLN 12,000</td><td class="num">60</td><td class="num">3</td></tr><tr><td>Webinars</td><td class="num">PLN 6,000</td><td class="num">18</td><td class="num">4</td></tr><tr><td>Newsletter</td><td class="num">PLN 2,000</td><td class="num">25</td><td class="num">2</td></tr><tr><td>Trade fairs</td><td class="num">PLN 10,000</td><td class="num">12</td><td class="num">1</td></tr></tbody></table></div><blockquote>Sales director: “LinkedIn brought the most enquiries, so give it the whole PLN 30,000.”</blockquote><blockquote>Head of finance: “As far as I remember, a contract is worth about 15 thousand, so every one of these channels pays off.”</blockquote><p>Decision due by Thursday.</p>',
 teza:[
  {id:'t1',text:'Give the whole PLN 30,000 to LinkedIn because it brought the most enquiries.',pts:0,note:'The director’s opinion and the enquiry count instead of cost per contract.'},
  {id:'t2',text:'Move budget from trade fairs and LinkedIn to webinars and the newsletter.',pts:2,note:'Matches the key. Risk: small samples (4 and 2 contracts).'},
  {id:'t3',text:'Move budget from trade fairs to webinars and the newsletter, and keep LinkedIn unchanged.',pts:2,note:'Defensible if the reasoning rests on cost per contract.'},
  {id:'t4',text:'Move the whole budget to the newsletter because it has the lowest cost per contract.',pts:1,note:'A conclusion from facts, but 2 contracts is a small sample and 25 enquiries caps the scale.'},
  {id:'t5',text:'Keep last quarter’s split.',pts:0,note:'No decision, although the data allow one.'},
  {id:'t6',text:'I need more data before I propose a split.',pts:0,note:'Analysis instead of a conclusion. The data are enough for a conclusion with stated risk.'},
  {id:'t7',text:'All channels pay off, so the split matters little.',pts:0,note:'Rests on an unconfirmed contract value and confuses revenue with profit.'},
  {id:'t8',text:'Ask the sales director for a recommendation, since they know the clients.',pts:0,note:'Deferring to authority instead of forming your own view.',flag:'autorytet'}],
 fakty:[
  {id:'f1',text:'Cost per contract: newsletter PLN 1,000, webinars PLN 1,500.',k:'K'},
  {id:'f2',text:'Cost per contract: LinkedIn PLN 4,000, trade fairs PLN 10,000.',k:'K'},
  {id:'f3',text:'Last quarter: 10 contracts on a PLN 30,000 budget, and the target is 12.',k:'K'},
  {id:'f4',text:'Webinars brought only 18 enquiries, so their scale is limited.',k:'K'},
  {id:'f5',text:'LinkedIn brought 60 enquiries, the most of all channels.',k:'N'},
  {id:'f6',text:'The average contract value is about PLN 15,000.',k:'T'},
  {id:'f7',text:'The sales director wants everything on LinkedIn.',k:'T'},
  {id:'f8',text:'Enquiry-to-contract conversion: webinars 22%, LinkedIn 5%.',k:'K'}],
 nFakty:'Key: cost per contract, 10 contracts on PLN 30,000, webinar scale, conversion. Traps: PLN 15,000 (unconfirmed) and the director’s opinion.',
 ofz:[
  {id:'s1',text:'The newsletter cost PLN 2,000 and brought 2 contracts.',key:'F'},
  {id:'s2',text:'LinkedIn brought the most enquiries, so give it the whole PLN 30,000.',key:'O'},
  {id:'s3',text:'As far as I remember, a contract is worth about 15 thousand.',key:'Z'},
  {id:'s4',text:'Every one of these channels pays off.',key:'Z'},
  {id:'s5',text:'Last quarter there were 10 contracts on a PLN 30,000 budget.',key:'F'},
  {id:'s6',text:'Webinars are the best channel.',key:'O'},
  {id:'s7',text:'With a bigger budget, webinars will deliver a similar result.',key:'Z'},
  {id:'s8',text:'Trade fairs cost PLN 10,000 and brought 1 contract.',key:'F'}],
 braki:[
  {id:'b1',text:'The actual value and margin of a contract (data from the system).',ok:true},
  {id:'b2',text:'Whether webinars and the newsletter will deliver the same result with a bigger budget.',ok:true},
  {id:'b3',text:'Whether Q4 is seasonally comparable with the previous quarter.',ok:true},
  {id:'b4',text:'How many people work in the marketing department.',ok:false},
  {id:'b5',text:'What prices competitors charge.',ok:false},
  {id:'b6',text:'What the sales director thinks about webinars.',ok:false}],
 nBraki:'Relevant gaps: contract value and margin, scaling, seasonality.',
 p:{who:'Sales director',text:'I’ve known this market for 15 years. LinkedIn always works. Put everything there.',claim:'LinkedIn always works'}
},
/* 2 */
{title:'Delayed implementation',
 caseHtml:'<h2>Delayed implementation</h2><p>A company is implementing an order-management system. Implementation deadline: 30 November. Today is 3 November, and the vendor reports a 3-week delay against the plan. Module status:</p><div class="tablewrap"><table><thead><tr><th>Status</th><th class="num">Modules</th></tr></thead><tbody><tr><td>Done and tested</td><td class="num">14</td></tr><tr><td>Done, awaiting testing</td><td class="num">2</td></tr><tr><td>In progress</td><td class="num">3</td></tr><tr><td>Not started</td><td class="num">1</td></tr></tbody></table></div><p>Options:</p><ul><li>A: add 2 developers from the vendor, cost PLN 48,000. The vendor estimates this will let them meet the deadline.</li><li>B: move the deadline by 3 weeks, contractual penalty PLN 10,000.</li></ul><blockquote>Vendor: “The delay is caused by requirement changes on the company’s side.”</blockquote><blockquote>IT manager: “It’s definitely the vendor’s fault. They had too few people from the start.”</blockquote><p>The board decides on Friday.</p>',
 teza:[
  {id:'t1',text:'Move the deadline by 3 weeks for PLN 10,000.',pts:2,note:'4.8 times cheaper, and it does not depend on the vendor’s estimate.'},
  {id:'t2',text:'Add 2 developers for PLN 48,000 to meet the deadline.',pts:1,note:'Nothing says the deadline is fixed. The effect is the vendor’s claim.'},
  {id:'t3',text:'First establish who is to blame, then decide.',pts:0,note:'The cause is not needed for Friday’s decision.'},
  {id:'t4',text:'Change the vendor.',pts:0,note:'Outside the options and without data.'},
  {id:'t5',text:'Accept the IT manager’s version and charge the costs to the vendor.',pts:0,note:'A hypothesis presented as fact.',flag:'autorytet'},
  {id:'t6',text:'Move the deadline and demand that the vendor covers the penalty.',pts:1,note:'A good decision, but the claim rests on blame that has not been shown.'},
  {id:'t7',text:'Keep the deadline unchanged and wait.',pts:0,note:'No decision.'},
  {id:'t8',text:'Ask the IT manager which option they prefer and do that.',pts:0,note:'Deferring to authority.',flag:'autorytet'}],
 fakty:[
  {id:'f1',text:'14 of 20 modules are done and tested.',k:'K'},
  {id:'f2',text:'Moving the deadline by 3 weeks costs a PLN 10,000 penalty.',k:'K'},
  {id:'f3',text:'The extra developers cost PLN 48,000.',k:'K'},
  {id:'f4',text:'The effect of the extra developers is the vendor’s estimate, with no guarantee.',k:'K'},
  {id:'f5',text:'The delay against the plan is 3 weeks.',k:'N'},
  {id:'f6',text:'The delay is the vendor’s fault.',k:'T'},
  {id:'f7',text:'The delay is caused by requirement changes on the company’s side.',k:'T'},
  {id:'f8',text:'6 modules remain: 2 awaiting testing, 3 in progress, 1 not started.',k:'K'}],
 nFakty:'Key: module status, the cost of both options, no guarantee. Traps: the vendor’s fault and the requirement changes are claims made by the parties to a dispute, and nobody has verified them.',
 ofz:[
  {id:'s1',text:'The extra developers cost PLN 48,000.',key:'F'},
  {id:'s2',text:'It’s definitely the vendor’s fault.',key:'O'},
  {id:'s3',text:'Two developers will make up three weeks in two weeks.',key:'Z'},
  {id:'s4',text:'The penalty for moving the deadline is PLN 10,000.',key:'F'},
  {id:'s5',text:'Moving the deadline means the project has failed.',key:'O'},
  {id:'s6',text:'14 of 20 modules are done and tested.',key:'F'},
  {id:'s7',text:'Requirement changes caused the delay.',key:'Z'},
  {id:'s8',text:'After the deadline moves, there will be no further delays.',key:'Z'}],
 braki:[
  {id:'b1',text:'The cause of the delay, established from documents (requirements, schedule).',ok:true},
  {id:'b2',text:'Whether the 30 November deadline is fixed and what missing it means for the business.',ok:true},
  {id:'b3',text:'Whether the vendor will give a written guarantee of the extra developers’ effect.',ok:true},
  {id:'b4',text:'How many years the vendor has been on the market.',ok:false},
  {id:'b5',text:'What colours the system’s interface uses.',ok:false},
  {id:'b6',text:'What the IT manager thinks of the vendor.',ok:false}],
 nBraki:'Relevant gaps: the cause established from documents (who pays), how fixed the deadline is, the vendor’s guarantee.',
 p:{who:'IT manager',text:'I’ve worked in IT for 20 years and I know it’s their fault. Let’s charge them the costs and deliver on time with extra people.',claim:'It’s their fault'}
},
/* 3 */
{title:'Development programme impact',
 caseHtml:'<h2>Development programme impact</h2><p>A company ran a 6-month development programme for 30 salespeople. Comparison group: 30 salespeople without the programme, with similar tenure and in similar regions. Metric: average monthly sales per person (PLN thousand).</p><div class="tablewrap"><table><thead><tr><th>Group</th><th class="num">People</th><th class="num">Before</th><th class="num">After</th></tr></thead><tbody><tr><td>Programme</td><td class="num">30</td><td class="num">80</td><td class="num">92</td></tr><tr><td>Comparison</td><td class="num">30</td><td class="num">80</td><td class="num">88</td></tr></tbody></table></div><p>Programme cost: PLN 90,000 (PLN 3,000 per person). The board is asking about extending it to 150 salespeople (about PLN 450,000).</p><blockquote>HR director: “Sales grew by 15%, so the programme paid off.”</blockquote><blockquote>Head of sales: “The salespeople praise it highly.”</blockquote><p>The board decides on Thursday.</p>',
 teza:[
  {id:'t1',text:'Extend the programme to 150 people because sales grew by 15%.',pts:0,note:'The whole increase is credited to the programme, although the comparison group grew too.'},
  {id:'t2',text:'Do not extend it until someone estimates what a PLN 4 thousand difference in monthly sales is worth.',pts:2,note:'Matches the key: there is a net effect, and its value is unknown.'},
  {id:'t3',text:'Extend it to some of the salespeople as another test with a comparison group.',pts:2,note:'Defensible: it limits the cost and checks whether the effect repeats.'},
  {id:'t4',text:'Do not extend it because the programme does not work.',pts:0,note:'The net effect is positive (PLN 4 thousand per person), so this overreads the data.'},
  {id:'t5',text:'Extend it because the salespeople praise it.',pts:0,note:'Participants’ opinion instead of the result.',flag:'autorytet'},
  {id:'t6',text:'Ask for more data before proposing anything.',pts:0,note:'Analysis instead of a conclusion.'},
  {id:'t7',text:'Extend it because growth in the programme group (12 thousand) is larger than in the comparison group (8 thousand).',pts:1,note:'A correct comparison, but without margin and durability of the effect the conclusion is too strong.'},
  {id:'t8',text:'Ask the HR director for their assessment of the programme and adopt it.',pts:0,note:'Deferring to authority.',flag:'autorytet'}],
 fakty:[
  {id:'f1',text:'In the programme group sales per person grew by PLN 12 thousand, in the comparison group by PLN 8 thousand.',k:'K'},
  {id:'f2',text:'The programme’s net effect is about PLN 4 thousand in monthly sales per person.',k:'K'},
  {id:'f3',text:'The programme costs PLN 3,000 per person, and the extension about PLN 450,000.',k:'K'},
  {id:'f4',text:'The comparison group also grew, so part of the growth does not come from the programme.',k:'K'},
  {id:'f5',text:'Sales growth in the programme group was 15%.',k:'N'},
  {id:'f6',text:'The salespeople praise the programme highly.',k:'T'},
  {id:'f7',text:'The programme paid off.',k:'T'},
  {id:'f8',text:'The result concerns sales and says nothing about margin.',k:'K'}],
 nFakty:'Key: growth in both groups, a net effect of PLN 4 thousand, cost, and the fact that sales are different from margin. Traps: participants’ opinion and the HR director’s conclusion.',
 ofz:[
  {id:'s1',text:'In the comparison group, sales grew from 80 to 88 thousand PLN per person.',key:'F'},
  {id:'s2',text:'The programme paid off.',key:'O'},
  {id:'s3',text:'The programme’s effect will last after it ends.',key:'Z'},
  {id:'s4',text:'The programme for 30 people costs PLN 90,000.',key:'F'},
  {id:'s5',text:'The salespeople praise the programme highly.',key:'O'},
  {id:'s6',text:'With 150 people, the effect will be the same as with 30.',key:'Z'},
  {id:'s7',text:'In the programme group, sales grew from 80 to 92 thousand PLN per person.',key:'F'},
  {id:'s8',text:'The whole difference between the groups comes from the programme.',key:'Z'}],
 braki:[
  {id:'b1',text:'The margin on sales (how much of the PLN 4 thousand the company keeps).',ok:true},
  {id:'b2',text:'Whether the effect lasts after the programme ends (e.g. after another 6 months).',ok:true},
  {id:'b3',text:'How the comparison group was selected and whether it was truly comparable.',ok:true},
  {id:'b4',text:'What the training room looked like.',ok:false},
  {id:'b5',text:'How many salespeople the HR director knows personally.',ok:false},
  {id:'b6',text:'What development programmes other companies in the industry run.',ok:false}],
 nBraki:'Relevant gaps: margin, durability of the effect, how well the comparison group was selected.',
 p:{who:'HR director',text:'I’ve worked in people development for 15 years. Sales grew by 15%, so the programme works. Put down the extension for everyone.',claim:'Sales grew by 15%'}
},
/* 4 */
{title:'Tool licences',
 caseHtml:'<h2>Tool licences</h2><p>A department is buying an annual licence for a project-management tool.</p><ul><li>Price: PLN 120 per user per month.</li><li>10% discount for orders above 40 users.</li><li>Annual budget: PLN 60,000.</li><li>The IT department estimates that 35 people will use it. The HR department estimates 45. Nobody has checked the list in the HR system.</li><li>The vendor holds the offer until Friday.</li></ul><blockquote>Operations director: “Order for 45 people, it’s better to have a buffer.”</blockquote>',
 teza:[
  {id:'t1',text:'Order for 45 people because the operations director advises it.',pts:0,note:'The result fits the budget, but it rests on an opinion and an unknown number.',flag:'autorytet'},
  {id:'t2',text:'By Friday, get the number of users from the HR system and order for up to 46 people (the budget limit).',pts:2,note:'Matches the key: fill the gaps before the deadline, with the limit set by the budget.'},
  {id:'t3',text:'Order for 35 people because that is IT’s estimate.',pts:0,note:'One of two unverified estimates.'},
  {id:'t4',text:'Order for 40 people to land in the middle.',pts:0,note:'Guessing. At 40 people the discount does not apply.'},
  {id:'t5',text:'Ask the vendor to extend the offer and order after checking the number.',pts:1,note:'Sensible, but it depends on the vendor agreeing. Check the number by Friday first.'},
  {id:'t6',text:'Order for 45 people and check the number after the purchase.',pts:1,note:'It fits the budget, but the decision comes before the number is checked.'},
  {id:'t7',text:'Do not order until there is certainty.',pts:0,note:'The offer expires on Friday.'},
  {id:'t8',text:'Ask IT and HR who is right and adopt the view of whoever sounds more confident.',pts:0,note:'Confidence instead of data.',flag:'autorytet'}],
 fakty:[
  {id:'f1',text:'The annual price is PLN 1,440 per user (PLN 120 times 12).',k:'K'},
  {id:'f2',text:'35 users cost PLN 50,400.',k:'K'},
  {id:'f3',text:'45 users with the 10% discount cost PLN 58,320, which fits the budget.',k:'K'},
  {id:'f4',text:'Without the discount, 45 users cost PLN 64,800, which is PLN 4,800 over budget.',k:'K'},
  {id:'f5',text:'IT estimates 35 users, HR 45, and nobody has checked the list in the HR system.',k:'K'},
  {id:'f6',text:'The annual budget is PLN 60,000.',k:'N'},
  {id:'f7',text:'It’s better to have a buffer.',k:'T'},
  {id:'f8',text:'45 people will use the tool.',k:'T'}],
 nFakty:'Key: prices for 35 and 45 people, the role of the discount, no verified number. Traps: the “buffer” and 45 people presented as fact.',
 ofz:[
  {id:'s1',text:'The price is PLN 120 per user per month.',key:'F'},
  {id:'s2',text:'It’s better to have a buffer.',key:'O'},
  {id:'s3',text:'45 people will use the tool.',key:'Z'},
  {id:'s4',text:'The 10% discount applies to orders above 40 users.',key:'F'},
  {id:'s5',text:'The number of users will not change during the year.',key:'Z'},
  {id:'s6',text:'The vendor holds the offer until Friday.',key:'F'},
  {id:'s7',text:'HR’s estimate is more reliable than IT’s.',key:'O'},
  {id:'s8',text:'The vendor will extend the offer if we ask.',key:'Z'}],
 braki:[
  {id:'b1',text:'The exact number of users from the HR system.',ok:true},
  {id:'b2',text:'Whether the vendor will extend the offer past Friday.',ok:true},
  {id:'b3',text:'Whether licences can be added during the year and at what price.',ok:true},
  {id:'b4',text:'What colour the vendor’s logo is.',ok:false},
  {id:'b5',text:'How big another department’s budget is.',ok:false},
  {id:'b6',text:'What the operations director thinks of the vendor.',ok:false}],
 nBraki:'Relevant gaps: the number of users, whether the offer can be extended, adding licences during the year.',
 p:{who:'Operations director',text:'I’ve made purchases like this dozens of times. 45 people is a safe number. Order it and we’re covered.',claim:'45 people is a safe number'}
},
/* 5 */
{title:'Offer description on the website',
 caseHtml:'<h2>Offer description on the website</h2><p>A small research agency (4 people) changed the offer description on its website three times in five weeks, each time on the advice of a different person. Monthly data after each change:</p><div class="tablewrap"><table><thead><tr><th>Version</th><th>Change (whose advice)</th><th class="num">Visits</th><th class="num">Enquiries</th></tr></thead><tbody><tr><td>Original</td><td>none</td><td class="num">400</td><td class="num">4</td></tr><tr><td>1</td><td>Shorter description (client)</td><td class="num">380</td><td class="num">5</td></tr><tr><td>2</td><td>Certificates added (industry colleague)</td><td class="num">410</td><td class="num">3</td></tr><tr><td>3</td><td>More photos (designer)</td><td class="num">390</td><td class="num">4</td></tr></tbody></table></div><blockquote>A client from the target group: “I’ve been buying services like this for years. Turn the headline into a question to the client, and then I’ll click.”</blockquote><p>The owner decides by Monday whether to make a fourth change.</p>',
 teza:[
  {id:'t1',text:'Make the fourth change because a client from the target group recommends it.',pts:0,note:'The authority of the target group taken as evidence.',flag:'autorytet'},
  {id:'t2',text:'Do not make a fourth change. Keep one version for 8 weeks and measure enquiries.',pts:2,note:'Matches the key: the changes were noise, and a longer trial is needed.'},

// ── Język interfejsu (PL/EN) ────────────────────────────────────────────────
// Wybór studenta jest w localStorage pod 'mba_lang' (wspólny z index.html),
// a ?lang=en w adresie go ustawia.
const MBA_LANG_KEY = 'mba_lang';
function mbaReadLang() {
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'pl' || q === 'en') { localStorage.setItem(MBA_LANG_KEY, q); return q; }
    return localStorage.getItem(MBA_LANG_KEY) === 'en' ? 'en' : 'pl';
  } catch(e) { return 'pl'; }
}
let MBA_LANG = mbaReadLang();
const MBA_TITLE_PL = document.title;

function t(key, vars) {
  const dict = I18N[MBA_LANG] || {};
  let s = dict[key] !== undefined ? dict[key] : (I18N.pl[key] !== undefined ? I18N.pl[key] : key);
  if (vars) Object.keys(vars).forEach(function(k) { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}

const WORKER_ERR_EN = {
  'Brak hasła': 'Enter your group password.',
  'Nieprawidłowe hasło grupy': 'Invalid group password.',
  'Dostęp dla tej grupy został zamknięty': 'Access for this group has been closed.',
  'Dostęp do tej grupy jeszcze nie jest aktywny': 'Access for this group is not active yet.',
  'Dostęp dla tej grupy wygasł': 'Access for this group has expired.'
};
function workerErr(msg, fallbackKey) {
  if (!msg) return t(fallbackKey);
  if (MBA_LANG !== 'en') return msg;
  if (WORKER_ERR_EN[msg]) return WORKER_ERR_EN[msg];
  const wait = /^Za dużo.*?(\d+)s\.$/.exec(msg);
  if (wait) return 'Too many attempts. Try again in ' + wait[1] + 's.';
  return t(fallbackKey);
}

function applyI18n() {
  const en = MBA_LANG === 'en';
  document.documentElement.lang = MBA_LANG;
  document.title = en ? I18N.en['page.title'] : MBA_TITLE_PL;
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    if (el.dataset.i18nPl === undefined) el.dataset.i18nPl = el.textContent;
    const v = I18N.en[el.dataset.i18n];
    el.textContent = en && v !== undefined ? v : el.dataset.i18nPl;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el) {
    if (el.dataset.i18nPlPh === undefined) el.dataset.i18nPlPh = el.placeholder;
    const v = I18N.en[el.dataset.i18nPh];
    el.placeholder = en && v !== undefined ? v : el.dataset.i18nPlPh;
  });
  document.querySelectorAll('.lang-switch button').forEach(function(b) {
    b.classList.toggle('active', b.dataset.lang === MBA_LANG);
  });
}

function setLang(lang) {
  if (state && state.stage === 'run') return; // w trakcie kroku z zegarem język jest zablokowany
  MBA_LANG = lang === 'en' ? 'en' : 'pl';
  try { localStorage.setItem(MBA_LANG_KEY, MBA_LANG); } catch(e) {}
  applyI18n();
  renderStage();
}

function mountLangSwitches() {
  document.querySelectorAll('.lang-switch-slot').forEach(function(slot) {
    const sw = document.createElement('div');
    sw.className = 'lang-switch';
    ['pl', 'en'].forEach(function(code) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.lang = code;
      b.textContent = code.toUpperCase();
      b.onclick = function() { setLang(code); };
      sw.appendChild(b);
    });
    slot.appendChild(sw);
  });
}

async function verifyGroupGate() {
  const inp = document.getElementById('mba-gate-input');
  const err = document.getElementById('gate-err');
  const btn = document.getElementById('gate-btn');
  const pw = (inp ? inp.value : '').trim();
  if (!pw) { err.textContent = t('gate.empty'); return; }
  btn.disabled = true; btn.textContent = t('gate.checking');
  err.textContent = '';
  try {
    const res = await fetch(WORKER + '/verify-group', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (data.valid) {
      const allowed = data.allowedExercises;
      if (allowed && !allowed.includes(EXERCISE_ID)) {
        document.getElementById('mba-group-gate').style.display = '';
        err.textContent = t('gate.noaccess');
        btn.disabled = false; btn.textContent = t('gate.btn');
        return;
      }
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        password: pw, groupName: data.groupName, allowedExercises: data.allowedExercises
      }));
      document.getElementById('mba-group-gate').style.display = 'none';
      showTopbarGroup(data.groupName);
    } else {
      document.getElementById('mba-group-gate').style.display = '';
      err.textContent = workerErr(data.error, 'gate.bad');
    }
  } catch(e) { err.textContent = t('gate.net'); }
  btn.disabled = false; btn.textContent = t('gate.btn');
}

// ── Model ćwiczenia ─────────────────────────────────────────────────────────
const STAGES = [[0],[1,2],[3,4,5]];
const STAGEMULT = [1, 0.8, 0.65];
const STEPS_PER_SCEN = 6;
const TOTAL_STEPS = 6 * STEPS_PER_SCEN;

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function SC() { return SCEN[MBA_LANG] || SCEN.pl; }
function LET(v) { return v === '-' ? '-' : t('L.' + v); }
function stageName(s) { return t('stage.n' + s); }

function presjaOptions(sc) {
  const p = sc.p;
  return [
    {id:'r1', text:t('r1'), pts:0, note:t('r1n'), flag:'autorytet'},
    {id:'r2', text:t('r2'), pts:2, note:t('r2n')},
    {id:'r3', text:t('r3'), pts:0, note:t('r3n'), flag:'relacja'},
    {id:'r4', text:t('r4', {claim:p.claim}), pts:0, note:p.r4note || t('r4n')},
    {id:'r5', text:t('r5'), pts:0, note:t('r5n')},
    {id:'r6', text:t('r6'), pts:2, note:t('r6n')},
    {id:'r7', text:t('r7'), pts:1, note:t('r7n')}
  ];
}

function stepsFor(si) {
  const sc = SC()[si];
  return [
    {id:'read',   title:t('st.read'),   type:'read',   time:30, prompt:t('st.read.p')},
    {id:'teza',   title:t('st.teza'),   type:'single', time:20, prompt:t('st.teza.p'), options:sc.teza},
    {id:'fakty',  title:t('st.fakty'),  type:'multi', max:3, time:30, prompt:t('st.fakty.p'), options:sc.fakty},
    {id:'ofz',    title:t('st.ofz'),    type:'ofz',    time:45, prompt:t('st.ofz.p'), options:sc.ofz},
    {id:'braki',  title:t('st.braki'),  type:'multi', max:2, time:20, prompt:t('st.braki.p'), options:sc.braki},
    {id:'presja', title:t('st.presja'), type:'single', time:25, prompt:t('st.presja.p', {who:sc.p.who, text:sc.p.text}), options:presjaOptions(sc)}
  ];
}
function optById(step, id) { for (let i = 0; i < step.options.length; i++) { if (step.options[i].id === id) return step.options[i]; } return null; }

// ── Stan ───────────────────────────────────────────────────────────────────
function fresh(mult) { return {mult:mult || 1, stage:'start', st:0, sp:0, idx:0, ans:{}, times:{}, order:{}, unlocked:[false,false,false], saved:false}; }
let state = fresh(1);
state.stage = 'learn';
const WARM = {};
let NICK = '';
let MULT_CHOICE = '1';
let t0 = 0, tlimit = 0, timerId = null;
function curSi() { return STAGES[state.st][state.sp]; }
function stageMult() { return state.mult * STAGEMULT[state.st]; }

// ── Zegar ──────────────────────────────────────────────────────────────────
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function startTimer(sec) {
  stopTimer();
  t0 = performance.now();
  tlimit = sec * stageMult() * 1000;
  timerId = setInterval(function() {
    const el = performance.now() - t0, left = Math.max(0, tlimit - el);
    const n = $('#tleft'), b = $('#tbar'), tm = $('#timer');
    if (n) n.textContent = Math.ceil(left / 1000);
    if (b) b.style.width = (left / tlimit * 100) + '%';
    if (tm && left <= 5000) tm.classList.add('urgent');
    if (left <= 0) finishStep(true);
  }, 100);
}
function finishStep(timedOut) {
  const used = Math.min((performance.now() - t0) / 1000, tlimit / 1000);
  stopTimer();
  const si = curSi(), s = stepsFor(si)[state.idx];
  state.times[si] = state.times[si] || {};
  state.times[si][s.id] = {used:Math.round(used * 10) / 10, timedOut:!!timedOut, limit:Math.round(tlimit / 1000)};
  if (state.idx < STEPS_PER_SCEN - 1) { state.idx++; }
  else if (state.sp < STAGES[state.st].length - 1) { state.sp++; state.idx = 0; }
  else { state.stage = (state.st < 2) ? 'stageEnd' : 'final'; }
  renderStage();
  window.scrollTo(0, 0);
  if (state.stage === 'final' && !state.saved) { state.saved = true; saveResult(); }
}

// ── Punktacja ──────────────────────────────────────────────────────────────
function score(si) {
  const A = state.ans[si] || {}, steps = stepsFor(si), r = [];
  function step(id) { for (let i = 0; i < steps.length; i++) { if (steps[i].id === id) return steps[i]; } }
  const none = t('none');
  let st = step('teza'), a = A.teza, o = a ? optById(st, a) : null;
  r.push({id:'teza', title:st.title, pts:o ? o.pts : 0, clean:[o ? o.text : none], tagged:[o ? o.text : none], note:o ? o.note : t('noTeza'), flag:o && o.flag});

  st = step('fakty');
  let sel = A.fakty || [], key = 0, trap = 0, cl = [], tg = [];
  sel.forEach(function(id) {
    const x = optById(st, id);
    if (x.k === 'K') key++; else if (x.k === 'T') trap++;
    cl.push(x.text); tg.push(x.text + ' [' + t('tag.' + x.k) + ']');
  });
  r.push({id:'fakty', title:st.title, pts:(key >= 2 && trap === 0) ? 2 : (key >= 1 && trap <= 1) ? 1 : 0, clean:cl.length ? cl : [none], tagged:tg.length ? tg : [none], note:SC()[si].nFakty});

  st = step('ofz');
  const oa = A.ofz || {}; let good = 0; const miss = [], cl2 = [];
  st.options.forEach(function(x) {
    const v = oa[x.id] || '-';
    if (v === x.key) good++; else miss.push(x.text + ' (' + t('you') + ': ' + LET(v) + ', ' + t('key') + ': ' + LET(x.key) + ')');
    cl2.push(x.text + ' → ' + LET(v));
  });
  r.push({id:'ofz', title:t('res.ofz'), pts:good >= 7 ? 2 : good >= 5 ? 1 : 0, clean:cl2, tagged:cl2, note:t('matches', {n:good, m:st.options.length}), diff:miss});

  st = step('braki');
  const bs = A.braki || []; let bv = 0; const bc = [], bt = [];
  bs.forEach(function(id) {
    const x = optById(st, id);
    if (x.ok) bv++;
    bc.push(x.text); bt.push(x.text + ' [' + t(x.ok ? 'tag.ok' : 'tag.off') + ']');
  });
  r.push({id:'braki', title:st.title, pts:bv === 2 ? 2 : bv === 1 ? 1 : 0, clean:bc.length ? bc : [none], tagged:bt.length ? bt : [none], note:SC()[si].nBraki});

  st = step('presja'); a = A.presja; o = a ? optById(st, a) : null;
  r.push({id:'presja', title:st.title, pts:o ? o.pts : 0, clean:[o ? o.text : none], tagged:[o ? o.text : none], note:o ? o.note : t('noPresja'), flag:o && o.flag});
  return r;
}
function total(r) { let s = 0; r.forEach(function(x) { s += x.pts; }); return s; }
function grandTotal() { let s = 0; for (let q = 0; q < 6; q++) s += total(score(q)); return s; }

function resultsText(si) {
  const r = score(si), T = state.times[si] || {};
  const L = [t('txt.scen', {t:SC()[si].title, p:total(r)})];
  r.forEach(function(x) {
    const tm = T[x.id] || {};
    L.push(t('txt.line', {t:x.title, p:x.pts, u:(tm.used != null ? tm.used : '-'), l:(tm.limit || '-'), x:(tm.timedOut ? t('txt.over') : '')}));
    x.tagged.forEach(function(c) { L.push('  - ' + c); });
    if (x.diff && x.diff.length) { L.push(t('txt.diff')); x.diff.forEach(function(d) { L.push('  * ' + d); }); }
    L.push(t('txt.note') + x.note);
    if (x.flag) L.push(t('txt.trace') + t('flag.' + x.flag));
  });
  return L.join('\n');
}
// force=true: pełny wynik z kluczem niezależnie od odblokowania (zapis dla prowadzącego).
function allText(force) {
  const parts = [t('txt.head', {m:state.mult})];
  for (let s = 0; s < 3; s++) {
    parts.push('');
    parts.push(t('txt.stage', {s:s + 1, n:stageName(s), m:(state.mult * STAGEMULT[s]).toFixed(2)}));
    if (!force && !state.unlocked[s]) { parts.push(t('txt.locked')); continue; }
    let tot = 0;
    STAGES[s].forEach(function(si) { parts.push(''); parts.push(resultsText(si)); tot += total(score(si)); });
    parts.push(''); parts.push(t('txt.stageTotal', {s:s + 1, p:tot, m:STAGES[s].length * 10}));
  }
  return parts.join('\n');
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderProgress() {
  const wrap = $('#progress');
  const on = state.stage === 'run' || state.stage === 'intro';
  wrap.classList.toggle('on', on);
  if (!on) return;
  const firstSi = STAGES[state.st][0];
  const done = state.stage === 'run' ? curSi() * STEPS_PER_SCEN + state.idx : firstSi * STEPS_PER_SCEN;
  $('#prog-left').innerHTML = '<strong>' + esc(t('stage')) + ' ' + (state.st + 1) + ' ' + esc(t('of')) + ' 3</strong> · ' + esc(stageName(state.st));
  $('#prog-right').textContent = state.stage === 'run'
    ? t('prog.scen', {a:state.sp + 1, b:STAGES[state.st].length, c:state.idx + 1})
    : '';
  $('#prog-fill').style.width = (done / TOTAL_STEPS * 100) + '%';
}

function renderOpts() {
  const si = curSi(), s = stepsFor(si)[state.idx], box = $('#opts');
  if (!box) return;
  state.ans[si] = state.ans[si] || {};
  const ans = state.ans[si][s.id];
  const order = (state.order[si] && state.order[si][s.id]) || [];
  let html = '';
  if (s.type === 'read') {
    html = '<p class="note">' + esc(t('read.note')) + '</p>';
  } else if (s.type === 'single') {
    html = '<div class="opts" role="radiogroup" aria-label="' + esc(s.title) + '">';
    order.forEach(function(id) {
      const o = optById(s, id);
      html += '<button type="button" class="opt" role="radio" aria-checked="' + (ans === id) + '" data-act="pick" data-id="' + id + '">' + esc(o.text) + '</button>';
    });
    html += '</div>';
  } else if (s.type === 'multi') {
    const sel = ans || [];
    html = '<p class="counter">' + esc(t('chosen', {n:sel.length, m:s.max})) + '</p><div class="opts" role="group" aria-label="' + esc(s.title) + '">';
    order.forEach(function(id) {
      const o = optById(s, id), on = sel.indexOf(id) > -1;
      html += '<button type="button" class="opt" role="checkbox" aria-checked="' + on + '" data-act="toggle" data-id="' + id + '">' + esc(o.text) + '</button>';
    });
    html += '</div>';
  } else if (s.type === 'ofz') {
    const a = ans || {}, done = Object.keys(a).length;
    html = '<p class="legend">' + esc(t('legend', {n:done, m:s.options.length})) + '</p>';
    order.forEach(function(id) {
      const o = optById(s, id);
      html += '<div class="ofzrow"><div>' + esc(o.text) + '</div><div class="ofzgrp" role="group" aria-label="' + esc(t('mark')) + '">';
      ['F','O','Z'].forEach(function(v) {
        html += '<button type="button" class="ofzb" aria-pressed="' + (a[id] === v) + '" data-act="ofz" data-id="' + id + '" data-v="' + v + '">' + esc(LET(v)) + '</button>';
      });
      html += '</div></div>';
    });
  }
  box.innerHTML = html;
}

function stageBlock(st) {
  const unlocked = state.unlocked[st];
  let h = '<div class="stage"><h3>' + esc(t('stage')) + ' ' + (st + 1) + ' · ' + esc(stageName(st)) + '</h3>';
  let stTotal = 0;
  STAGES[st].forEach(function(si) {
    const r = score(si), T = state.times[si] || {}, tot = total(r);
    stTotal += tot;
    h += '<div class="scen"><h4>' + esc(SC()[si].title) + (unlocked ? ' <span class="pill p' + (tot >= 8 ? 2 : tot >= 5 ? 1 : 0) + '">' + tot + ' / 10</span>' : '') + '</h4>';
    r.forEach(function(x) {
      const tm = T[x.id] || {};
      h += '<div class="sumrow"><h5>' + esc(x.title) + (unlocked ? ' <span class="pill p' + x.pts + '">' + x.pts + ' / 2</span>' : '') + '</h5>';
      h += '<div class="tm">' + esc(t('secOf', {u:(tm.used != null ? tm.used : '-'), l:(tm.limit || '-')})) + (tm.timedOut ? ' · ' + esc(t('timedOut')) : '') + '</div>';
      const lines = unlocked ? x.tagged : x.clean;
      if (lines.length > 1 || x.id === 'fakty' || x.id === 'braki' || x.id === 'ofz') {
        h += '<ul>' + lines.map(function(c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';
      } else {
        h += '<div>' + esc(lines[0]) + '</div>';
      }
      if (unlocked) {
        h += '<div class="note">' + esc(x.note) + '</div>';
        if (x.diff && x.diff.length) {
          h += '<ul>' + x.diff.map(function(d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul><div class="note">' + esc(t('diffQ')) + '</div>';
        }
        if (x.flag) h += '<div class="note">' + esc(t('trace', {f:t('flag.' + x.flag)})) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  });
  if (unlocked) {
    h += '<div class="total">' + esc(t('stageTotal', {s:st + 1, p:stTotal, m:STAGES[st].length * 10})) + '</div>';
  } else {
    h += '<div class="unlock"><div class="eyebrow" style="margin-bottom:4px">' + esc(t('unlock.h')) + '</div>' +
      '<label class="field-label" for="code-' + st + '" style="margin-top:8px">' + esc(t('unlock.label')) + '</label>' +
      '<div class="unlock-row"><input class="text-input" type="password" id="code-' + st + '" autocomplete="off" aria-describedby="hint-' + st + '" data-stage="' + st + '">' +
      '<button type="button" class="btn btn-ghost" data-act="unlock" data-stage="' + st + '">' + esc(t('unlock.btn')) + '</button></div>' +
      '<p class="note" id="hint-' + st + '">' + esc(t('unlock.hint')) + '</p></div>';
  }
  h += '</div>';
  return h;
}

function renderLearn(p) {
  const defs = [
    {l:t('L.F'), k:'F', ex:true}, {l:t('L.O'), k:'O', ex:true}, {l:t('L.Z'), k:'Z', ex:true},
    {l:t('def.T.l'), k:'T'}, {l:t('def.B.l'), k:'B'}
  ];
  let L = '<div class="eyebrow">' + esc(t('learn.eyebrow')) + '</div><h1 class="page-title">' + esc(t('learn.h')) + '</h1><p class="prompt">' + esc(t('learn.p')) + '</p><div class="defs">';
  defs.forEach(function(d) {
    L += '<div class="def"><h3><span class="letter">' + esc(d.l) + '</span> ' + esc(t('def.' + d.k + '.h')) + '</h3><p>' + esc(t('def.' + d.k + '.p')) + '</p>' +
      (d.ex ? '<p class="ex">' + esc(t('def.' + d.k + '.ex')) + '</p>' : '') + '<p class="q">' + esc(t('def.' + d.k + '.q')) + '</p></div>';
  });
  L += '</div><div class="note-box">' + t('rule') + '</div>';
  L += '<h3>' + esc(t('steps.h')) + '</h3><div class="tablewrap"><table><thead><tr><th>' + esc(t('steps.c1')) + '</th><th>' + esc(t('steps.c2')) + '</th></tr></thead><tbody>';
  [['st.read','steps.read'],['st.teza','steps.teza'],['st.fakty','steps.fakty'],['st.ofz','steps.ofz'],['st.braki','steps.braki'],['st.presja','steps.presja']].forEach(function(r) {
    L += '<tr><td><strong>' + esc(t(r[0])) + '</strong></td><td>' + esc(t(r[1])) + '</td></tr>';
  });
  L += '</tbody></table></div>';
  L += '<div class="warm"><h3>' + esc(t('warm.h')) + '</h3><p class="note" style="margin-bottom:6px">' + esc(t('warm.p')) + '</p>';
  (WARMQ[MBA_LANG] || WARMQ.pl).forEach(function(q) {
    const a = WARM[q.id];
    L += '<div class="ofzrow"><div>' + esc(q.text) +
      (a ? '<p class="fb ' + (a === q.key ? 'ok' : 'bad') + '">' + esc(a === q.key ? t('warm.yes') : t('warm.no', {k:LET(q.key)})) + esc(q.why) + '</p>' : '') +
      '</div><div class="ofzgrp" role="group" aria-label="' + esc(t('mark')) + '">';
    ['F','O','Z'].forEach(function(v) {
      L += '<button type="button" class="ofzb" aria-pressed="' + (a === v) + '" data-act="warm" data-id="' + q.id + '" data-v="' + v + '">' + esc(LET(v)) + '</button>';
    });
    L += '</div></div>';
  });
  L += '</div><div class="btn-row"><button type="button" class="btn btn-primary" data-act="tostart">' + esc(t('btn.tostart')) + '</button></div>';
  p.innerHTML = L;
}

function renderStart(p) {
  if (!NICK) NICK = window.mbaGetKsywa ? window.mbaGetKsywa() : '';
  const opts = [['1','mult.1'],['1.5','mult.15'],['2','mult.2'],['0.75','mult.075']];
  p.innerHTML = '<div class="eyebrow">' + esc(t('start.eyebrow')) + '</div><h1 class="page-title">' + esc(t('start.h')) + '</h1><ul class="rules">' +
    ['rules.1','rules.2','rules.3','rules.4','rules.5'].map(function(k) { return '<li>' + esc(t(k)) + '</li>'; }).join('') + '</ul>' +
    '<div class="form-row"><label class="field-label" for="nick">' + esc(t('nick')) + '</label>' +
    '<input class="text-input" type="text" id="nick" maxlength="30" autocomplete="off" placeholder="' + esc(t('nick.ph')) + '" value="' + esc(NICK) + '">' +
    '<div class="field-err" id="nick-err"></div></div>' +
    '<div class="form-row"><label class="field-label" for="mult">' + esc(t('mult')) + '</label><select class="text-input" id="mult">' +
    opts.map(function(o) { return '<option value="' + o[0] + '"' + (MULT_CHOICE === o[0] ? ' selected' : '') + '>' + esc(t(o[1])) + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="btn-row"><button type="button" class="btn btn-primary" data-act="start">' + esc(t('btn.start')) + '</button></div>';
}

function renderStage() {
  stopTimer();
  const p = $('#panel'), g = $('#grid'), main = $('#main');
  const run = state.stage === 'run';
  g.className = 'grid' + (run ? '' : ' single');
  main.classList.toggle('wide', run);
  document.body.classList.toggle('lang-fixed', run);
  $('#case-eyebrow').textContent = t('case');
  $('#save-status').style.display = (state.stage === 'final' && $('#save-status').childNodes.length) ? '' : 'none';
  renderProgress();

  if (state.stage === 'learn') { renderLearn(p); return; }
  if (state.stage === 'start') { renderStart(p); return; }
  if (state.stage === 'intro') {
    p.innerHTML = '<div class="eyebrow">' + esc(t('intro.h', {s:state.st + 1})) + '</div><h1 class="page-title">' + esc(stageName(state.st)) + '</h1>' +
      '<p class="prompt">' + esc(t('intro.p', {p:Math.round(stageMult() * 100)})) + '</p>' +
      '<div class="btn-row"><button type="button" class="btn btn-primary" data-act="startstage">' + esc(t('btn.startstage', {s:state.st + 1})) + '</button></div>';
    return;
  }
  if (state.stage === 'stageEnd') {
    p.innerHTML = '<div class="eyebrow">' + esc(t('end.eyebrow', {s:state.st + 1})) + '</div><h1 class="page-title">' + esc(t('end.h')) + '</h1><p class="prompt">' + esc(t('end.p')) + '</p>' +
      stageBlock(state.st) +
      '<div class="btn-row"><button type="button" class="btn btn-primary" data-act="nextstage">' + esc(t('btn.next', {s:state.st + 2})) + '</button></div>';
    return;
  }
  if (state.stage === 'final') {
    let h = '<div class="eyebrow">' + esc(t('final.eyebrow')) + '</div><h1 class="page-title">' + esc(t('final.h')) + '</h1><p class="prompt">' + esc(t('final.p')) + '</p>';
    for (let s = 0; s < 3; s++) h += stageBlock(s);
    if (state.unlocked[0] && state.unlocked[1] && state.unlocked[2]) h += '<div class="grand">' + esc(t('grand', {p:grandTotal()})) + '</div>';
    h += '<div class="btn-row"><button type="button" class="btn btn-ghost" data-act="restart">' + esc(t('btn.restart')) + '</button><button type="button" class="btn btn-primary" data-act="copy">' + esc(t('btn.copy')) + '</button></div><div id="copybox"></div>';
    p.innerHTML = h;
    return;
  }
  /* run */
  const si = curSi(), steps = stepsFor(si), s2 = steps[state.idx];
  state.ans[si] = state.ans[si] || {}; state.order[si] = state.order[si] || {};
  if (!state.order[si][s2.id] && s2.options) {
    const ids = s2.options.map(function(o) { return o.id; });
    state.order[si][s2.id] = s2.type === 'ofz' ? ids : shuffle(ids);
  }
  $('#casebox').innerHTML = SC()[si].caseHtml;
  const last = state.idx === steps.length - 1;
  p.innerHTML = '<div class="eyebrow">' + esc(t('stage')) + ' ' + (state.st + 1) + ' · ' + esc(t('prog.scen', {a:state.sp + 1, b:STAGES[state.st].length, c:state.idx + 1})) + '</div>' +
    '<h2 class="step-title">' + esc(s2.title) + '</h2>' +
    '<p class="prompt">' + esc(s2.prompt) + '</p>' +
    '<div class="timer" id="timer"><span class="tnum"><span id="tleft">' + Math.ceil(s2.time * stageMult()) + '</span> s</span><div class="bar"><i id="tbar"></i></div></div>' +
    '<div id="opts"></div>' +
    '<div class="btn-row"><button type="button" class="btn btn-primary" data-act="done">' + esc(s2.type === 'read' ? t('btn.read') : (last ? t('btn.last') : t('btn.ok'))) + '</button></div>';
  renderOpts();
  startTimer(s2.time);
}

// ── Zapis wyniku dla prowadzącego (/private-issue) ─────────────────────────
async function saveResult() {
  const session = loadSession();
  const groupName = session ? session.groupName : 'Nieznana';
  const password = session ? session.password : '';
  const tot = grandTotal();
  const stageTotals = [0,1,2].map(function(s) {
    let x = 0; STAGES[s].forEach(function(si) { x += total(score(si)); });
    return (s + 1) + ': ' + x + '/' + (STAGES[s].length * 10);
  }).join(' · ');
  const body = [
    '## ' + t('save.h'),
    '',
    '**' + t('save.nick') + ':** ' + NICK,
    '**' + t('save.group') + ':** ' + groupName,
    '**' + t('save.date') + ':** ' + new Date().toLocaleString('pl-PL'),
    '**' + t('save.lang') + ':** ' + MBA_LANG,
    '**' + t('save.total') + ': ' + tot + '/60** (' + stageTotals + ')',
    '',
    '```',
    allText(true),
    '```'
  ].join('\n');

  let saved = false;
  try {
    const res = await fetch(WORKER + '/private-issue', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        code: password,
        title: '🧭 Fakt/Opinia/Założenie · ' + NICK + ' · ' + groupName + ' · ' + tot + '/60',
        body: body,
        labels: ['fakt-opinia-zalozenie']
      })
    });
    const data = await res.json().catch(function() { return null; });
    saved = res.ok && !!(data && data.number);
  } catch(e) { console.warn('Zapis wyniku nieudany:', e); }
  showSaveStatus(saved);
}

function showSaveStatus(saved) {
  const box = $('#save-status');
  box.textContent = '';
  box.style.cssText = 'margin:0 0 16px;padding:12px 14px;font-size:0.9rem;line-height:1.5;border:1.5px solid;' +
    (saved ? 'border-color:#2E7D5B;background:#EAF5EF;color:#1F5A41;' : 'border-color:#C0392B;background:#FDF0EE;color:#8E2A1F;');
  if (saved) { box.textContent = t('save.ok'); return; }
  box.appendChild(document.createTextNode(t('save.fail')));
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = t('save.retry');
  btn.style.cssText = 'margin-top:8px;padding:8px 14px;border:0;background:#8E2A1F;color:#fff;font:inherit;font-weight:700;cursor:pointer;';
  btn.onclick = function() { btn.disabled = true; btn.textContent = t('save.saving'); saveResult(); };
  box.appendChild(document.createElement('br'));
  box.appendChild(btn);
}

// ── Zdarzenia ──────────────────────────────────────────────────────────────
function tryUnlock(st) {
  const inp = $('#code-' + st);
  const c = ((inp && inp.value) || '').trim().toLowerCase();
  if (c === HINT_PASS.toLowerCase()) { state.unlocked[st] = true; renderStage(); }
  else { const hint = $('#hint-' + st); if (hint) { hint.textContent = t('unlock.bad'); hint.style.color = 'var(--err)'; } }
}

document.addEventListener('input', function(e) {
  if (e.target.id === 'nick') NICK = e.target.value;
});
document.addEventListener('change', function(e) {
  if (e.target.id === 'mult') MULT_CHOICE = e.target.value;
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.target.id && e.target.id.indexOf('code-') === 0) tryUnlock(parseInt(e.target.dataset.stage, 10));
});

document.addEventListener('click', function(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  const run = state.stage === 'run';
  const si = run ? curSi() : null, s = run ? stepsFor(si)[state.idx] : null;
  if (act === 'warm') {
    WARM[id] = b.getAttribute('data-v'); renderStage();
  } else if (act === 'tostart') {
    state.stage = 'start'; renderStage(); window.scrollTo(0, 0);
  } else if (act === 'start') {
    const nick = (NICK || '').trim();
    if (!nick) { $('#nick-err').textContent = t('nick.err'); $('#nick').focus(); return; }
    NICK = nick;
    if (window.mbaSaveKsywa) window.mbaSaveKsywa(nick);
    const m = parseFloat(MULT_CHOICE);
    state = fresh(isNaN(m) ? 1 : m);
    state.stage = 'intro';
    $('#save-status').textContent = '';
    renderStage(); window.scrollTo(0, 0);
  } else if (act === 'startstage') {
    state.stage = 'run'; state.sp = 0; state.idx = 0; renderStage(); window.scrollTo(0, 0);
  } else if (act === 'nextstage') {
    state.st++; state.sp = 0; state.idx = 0; state.stage = 'intro'; renderStage(); window.scrollTo(0, 0);
  } else if (act === 'pick' && run) {
    state.ans[si][s.id] = id; renderOpts();
  } else if (act === 'toggle' && run) {
    const cur = state.ans[si][s.id] || [], i = cur.indexOf(id);
    if (i > -1) cur.splice(i, 1); else if (cur.length < s.max) cur.push(id);
    state.ans[si][s.id] = cur; renderOpts();
  } else if (act === 'ofz' && run) {
    const oa = state.ans[si][s.id] || {}; oa[id] = b.getAttribute('data-v'); state.ans[si][s.id] = oa; renderOpts();
  } else if (act === 'done' && run) {
    finishStep(false);
  } else if (act === 'unlock') {
    tryUnlock(parseInt(b.getAttribute('data-stage'), 10));
  } else if (act === 'copy') {
    const txt = allText(false);
    const ok = function() { const cb = $('#copybox'); if (cb) cb.innerHTML = '<p class="note">' + esc(t('copied')) + '</p>'; };
    const fallback = function() {
      const cb = $('#copybox');
      if (cb) { cb.innerHTML = '<p class="note">' + esc(t('copyManual')) + '</p><textarea class="copy-ta" id="ta" readonly></textarea>'; const ta = $('#ta'); ta.value = txt; ta.focus(); ta.select(); }
    };
    try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch(err) { fallback(); }
  } else if (act === 'restart') {
    state = fresh(state.mult); $('#save-status').textContent = ''; renderStage(); window.scrollTo(0, 0);
  }
});

document.addEventListener('DOMContentLoaded', function() {
  mountLangSwitches();
  applyI18n();
  const s = loadSession();
  if (s && s.groupName) showTopbarGroup(s.groupName);
  renderStage();
});
</script>
