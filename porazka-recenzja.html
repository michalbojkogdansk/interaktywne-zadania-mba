<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://mba-quiz-proxy.michal-bojko-gdansk.workers.dev; frame-ancestors 'none';">
<title>Porażka: recenzja MBA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --bg-page: #F7F9FA;
    --border: #D1D7DC;
    --text: #1C1D1F;
    --sec: #6A6F73;
    --accent: #5c4a1a;
    --accent-dark: #40340f;
    --accent-light: #F5EFE0;
    --purple: #5624D0;
    --ok: #1e7e34;
    --err: #c0392b;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; padding-top: 52px; }

  .mba-topbar { position:fixed; top:0; left:0; right:0; z-index:9990; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:52px; }
  .mba-topbar-left { display:flex; align-items:center; gap:16px; }
  .mba-topbar-back { display:flex; align-items:center; gap:6px; font-size:0.82rem; font-weight:700; color:var(--text); text-decoration:none; }
  .mba-topbar-back:hover { color:var(--purple); }
  .mba-topbar-divider { width:1px; height:20px; background:var(--border); }
  .mba-topbar-title { font-size:0.85rem; font-weight:700; }
  .mba-topbar-right { display:flex; align-items:center; gap:12px; }
  .mba-topbar-group { font-size:0.78rem; color:var(--sec); }
  .mba-topbar-group strong { color:var(--text); font-weight:700; }
  .mba-topbar-logout { font-size:0.75rem; font-weight:600; color:var(--purple); cursor:pointer; background:none; border:none; font-family:inherit; }
  .mba-topbar-logout:hover { text-decoration:underline; }

  #mba-group-gate { position:fixed; inset:0; background:#fff; z-index:9999; display:flex; align-items:center; justify-content:center; }
  .gate-box { background:#fff; border:1.5px solid var(--border); padding:48px 40px; max-width:420px; width:90%; }
  .gate-eyebrow { font-size:11px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:#9b8f84; margin-bottom:12px; }
  .gate-box h2 { font-size:1.6rem; font-weight:800; margin-bottom:8px; }
  .gate-box p { color:var(--sec); margin-bottom:24px; font-size:0.9rem; line-height:1.55; }
  .gate-input { width:100%; padding:13px 14px; border:1.5px solid var(--border); font-size:1rem; font-family:inherit; outline:none; margin-bottom:10px; }
  .gate-input:focus { border-color:var(--accent); }
  .gate-error { font-size:0.82rem; color:var(--err); margin-bottom:10px; min-height:18px; }
  .gate-btn { width:100%; padding:13px; background:var(--accent); color:#fff; border:none; font-size:0.95rem; font-weight:700; font-family:inherit; cursor:pointer; }
  .gate-btn:hover { background:var(--accent-dark); }
  .gate-btn:disabled { opacity:0.6; cursor:not-allowed; }

  .container { max-width:720px; margin:0 auto; padding:40px 24px 80px; }
  .page-head { margin-bottom:28px; }
  .page-eyebrow { font-size:11px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--sec); margin-bottom:8px; }
  .page-head h1 { font-size:1.7rem; font-weight:900; letter-spacing:-0.02em; }

  .option-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  .option-card { background:#fff; border:1.5px solid var(--border); padding:24px; cursor:pointer; text-align:left; font-family:inherit; }
  .option-card:hover { border-color:var(--accent); }
  .option-card.active { border-color:var(--accent); background:var(--accent-light); }
  .option-icon { font-size:1.6rem; margin-bottom:10px; }
  .option-title { font-size:0.95rem; font-weight:700; margin-bottom:6px; }
  .option-desc { font-size:0.8rem; color:var(--sec); line-height:1.5; }

  .panel { background:#fff; border:1.5px solid var(--border); padding:28px; display:none; }
  .panel.active { display:block; }
  .field-label { font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--sec); display:block; margin-bottom:6px; }
  .text-input { width:100%; padding:12px 14px; border:1.5px solid var(--border); font-size:0.95rem; font-family:inherit; outline:none; }
  .text-input:focus { border-color:var(--accent); }
  .status-note { font-size:0.82rem; margin-top:10px; min-height:18px; }
  .status-note.err { color:var(--err); }
  .status-note.ok { color:var(--ok); }
  .btn { padding:12px 24px; font-size:0.9rem; font-weight:700; font-family:inherit; cursor:pointer; border:none; margin-top:16px; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent-dark); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-link { display:inline-block; margin-top:16px; text-decoration:none; padding:12px 24px; background:var(--accent); color:#fff; font-size:0.9rem; font-weight:700; }
  .btn-link:hover { background:var(--accent-dark); }

  .result-box { margin-top:20px; padding:20px; background:var(--bg-page); border:1px solid var(--border); }
  .result-status { font-size:0.92rem; font-weight:700; margin-bottom:6px; }
  .result-detail { font-size:0.85rem; color:var(--sec); line-height:1.6; }
  .score-table { width:100%; margin-top:16px; border-collapse:collapse; }
  .score-table td { padding:8px 6px; font-size:0.82rem; border-bottom:1px solid var(--border); }
  .score-table td:last-child { text-align:right; font-weight:700; white-space:nowrap; }
  .comments-block { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); font-size:0.85rem; line-height:1.6; }

  @media (max-width:600px) {
    .option-grid { grid-template-columns:1fr; }
    .gate-box { padding:32px 24px; }
  }
</style>

<script>
(function(){
  var SK = 'mba_session';
  try {
    var s = JSON.parse(sessionStorage.getItem(SK));
    if (s && s.password) {
      var style = document.createElement('style');
      style.textContent = '#mba-group-gate{display:none!important}';
      document.head.appendChild(style);
      document.addEventListener('DOMContentLoaded', function() {
        var inp = document.getElementById('mba-gate-input');
        if (inp) { inp.value = s.password; style.remove(); if(typeof verifyGroupGate==='function') verifyGroupGate(); }
        else style.remove();
      });
    }
  } catch(e){}
})();
</script>
<script>
(function(){
  var KSYWA_KEY = 'mba_ksywa';
  function getKsywa() { try { return localStorage.getItem(KSYWA_KEY) || ''; } catch(e) { return ''; } }
  function saveKsywa(v) { try { localStorage.setItem(KSYWA_KEY, v); } catch(e) {} }
  window.mbaGetKsywa = getKsywa;
  window.mbaSaveKsywa = saveKsywa;
})();
</script>
</head>
<body>

<div class="mba-topbar">
  <div class="mba-topbar-left">
    <a class="mba-topbar-back" href="index.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 11L5 7L9 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Platforma MBA
    </a>
    <div class="mba-topbar-divider"></div>
    <div class="mba-topbar-title">Praca zespołowa</div>
  </div>
  <div class="mba-topbar-right">
    <div class="mba-topbar-group" id="tb-group" style="display:none">Grupa: <strong id="tb-groupname"></strong></div>
    <button class="mba-topbar-logout" id="tb-logout" style="display:none" onclick="mbaClearSession()">Wyloguj</button>
  </div>
</div>

<div id="mba-group-gate">
  <div class="gate-box">
    <p class="gate-eyebrow">Platforma MBA</p>
    <h2>Dostęp do platformy</h2>
    <p>Wpisz hasło swojej grupy, aby kontynuować.</p>
    <input class="gate-input" type="text" id="mba-gate-input" placeholder="Hasło grupy..." autocomplete="off" onkeydown="if(event.key==='Enter')verifyGroupGate();">
    <div class="gate-error" id="gate-err"></div>
    <button class="gate-btn" id="gate-btn" onclick="verifyGroupGate()">Wejdź →</button>
  </div>
</div>

<div class="container">
  <div class="page-head">
    <p class="page-eyebrow">Zarządzanie Porażką</p>
    <h1>Porażka: recenzja</h1>
  </div>

  <div class="option-grid">
    <button class="option-card" id="opt-review" onclick="selectOption('review')">
      <div class="option-icon">📋</div>
      <div class="option-title">Mam kod, chcę ocenić</div>
      <div class="option-desc">Dostałeś kod od koleżanki lub kolegi i masz ocenić ich ćwiczenie.</div>
    </button>
    <button class="option-card" id="opt-mine" onclick="selectOption('mine')">
      <div class="option-icon">🔍</div>
      <div class="option-title">Chcę zobaczyć swoją ocenę</div>
      <div class="option-desc">Ktoś już ocenił Twoje ćwiczenie i chcesz sprawdzić wynik.</div>
    </button>
  </div>

  <div class="panel" id="panel-review">
    <div class="field-label">Kod od autora</div>
    <p style="font-size:0.85rem; color:var(--sec); margin-bottom:14px;">Przejdziesz na osobną stronę recenzji, gdzie wpiszesz kod i swoją ksywę.</p>
    <a class="btn-link" href="recenzja.html">Przejdź do recenzji →</a>
  </div>

  <div class="panel" id="panel-mine">
    <div class="field-label">Twoja ksywa / pseudonim</div>
    <input class="text-input" type="text" id="mine-ksywa-input" placeholder="np. Panda, Orzeł, AS007..." maxlength="30" autocomplete="off" onkeydown="if(event.key==='Enter')checkMyReview();">
    <div class="status-note" id="mine-status"></div>
    <button class="btn btn-primary" id="mine-btn" onclick="checkMyReview()">Sprawdź ocenę →</button>

    <div class="result-box" id="mine-result" style="display:none;"></div>
  </div>
</div>

<script>
const WORKER = 'https://mba-quiz-proxy.michal-bojko-gdansk.workers.dev';
const SESSION_KEY = 'mba_session';

function mbaClearSession() {
  sessionStorage.removeItem(SESSION_KEY);
  window.location.href = 'index.html';
}

(function(){
  try {
    var s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
    if (s && s.groupName) {
      document.getElementById('tb-group').style.display = '';
      document.getElementById('tb-groupname').textContent = s.groupName;
      document.getElementById('tb-logout').style.display = '';
    }
  } catch(e){}
})();

async function verifyGroupGate() {
  const inp = document.getElementById('mba-gate-input');
  const err = document.getElementById('gate-err');
  const btn = document.getElementById('gate-btn');
  const pw = (inp ? inp.value : '').trim();
  if (!pw) { err.textContent = 'Wpisz hasło grupy.'; return; }
  btn.disabled = true; btn.textContent = 'Sprawdzam...';
  err.textContent = '';
  try {
    const res = await fetch(WORKER + '/verify-group', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (data.valid) {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        password: pw, groupName: data.groupName, allowedExercises: data.allowedExercises
      }));
      document.getElementById('mba-group-gate').style.display = 'none';
      document.getElementById('tb-group').style.display = '';
      document.getElementById('tb-groupname').textContent = data.groupName;
      document.getElementById('tb-logout').style.display = '';
    } else {
      err.textContent = data.error || 'Nieprawidłowe hasło grupy.';
    }
  } catch(e) { err.textContent = 'Błąd połączenia.'; }
  btn.disabled = false; btn.textContent = 'Wejdź →';
}

function selectOption(which) {
  document.getElementById('opt-review').classList.toggle('active', which === 'review');
  document.getElementById('opt-mine').classList.toggle('active', which === 'mine');
  document.getElementById('panel-review').classList.toggle('active', which === 'review');
  document.getElementById('panel-mine').classList.toggle('active', which === 'mine');
  if (which === 'mine') {
    const saved = (typeof mbaGetKsywa === 'function' ? mbaGetKsywa() : '') || '';
    const inp = document.getElementById('mine-ksywa-input');
    if (saved && !inp.value) inp.value = saved;
  }
}

const CRIT_LABELS = {
  faktografia: 'Rzetelność faktograficzna',
  rozdzielenie: 'Rozdzielenie faktów i interpretacji',
  audyt: 'Mapa wpływu i audyt kontroli',
  opis: 'Opis porażki bez usprawiedliwień',
  emocje: 'Nazwanie emocji',
  balans: 'Balans odpowiedzialności',
  zamkniecie: 'Jakość zamknięcia',
  why5: 'Głębokość 5 Why',
  rootcause: 'Kategoryzacja i przyczyna źródłowa',
  rekomendacje: 'Konkretność rekomendacji'
};

async function checkMyReview() {
  const inp = document.getElementById('mine-ksywa-input');
  const status = document.getElementById('mine-status');
  const resultBox = document.getElementById('mine-result');
  const btn = document.getElementById('mine-btn');
  status.className = 'status-note';
  status.textContent = '';
  resultBox.style.display = 'none';
  resultBox.innerHTML = '';

  const ksywa = (inp.value || '').trim();
  if (!ksywa) { status.className = 'status-note err'; status.textContent = 'Wpisz swoją ksywę.'; return; }

  btn.disabled = true; btn.textContent = 'Sprawdzam...';
  if (typeof mbaSaveKsywa === 'function') mbaSaveKsywa(ksywa);

  try {
    const res = await fetch(WORKER + '/my-review/' + encodeURIComponent(ksywa));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Błąd połączenia.');

    if (!data.found) {
      resultBox.style.display = '';
      resultBox.innerHTML = '<div class="result-status">Nie znaleziono ćwiczenia</div><div class="result-detail">Nie mamy zapisanego ćwiczenia „Zarządzanie Porażką” dla tej ksywy. Sprawdź pisownię albo upewnij się, że ćwiczenie zostało zakończone.</div>';
    } else if (data.status === 'no_invite') {
      resultBox.style.display = '';
      resultBox.innerHTML = '<div class="result-status">Brak wygenerowanego kodu</div><div class="result-detail">Twoje ćwiczenie zostało zapisane, ale nie wygenerowano jeszcze kodu dla recenzenta.</div>';
    } else if (data.status === 'pending') {
      resultBox.style.display = '';
      resultBox.innerHTML = '<div class="result-status">Czeka na recenzję</div><div class="result-detail">' +
        (data.reviewerKsywa ? 'Kod został odebrany przez ' + escapeHtml(data.reviewerKsywa) + ', ocena jeszcze nie została zapisana.' : 'Nikt jeszcze nie odebrał Twojego kodu do recenzji.') +
        '</div>';
    } else if (data.status === 'completed') {
      let rows = '';
      let total = 0, count = 0;
      Object.keys(CRIT_LABELS).forEach(function(key) {
        if (!(key in data.scores)) return;
        rows += '<tr><td>' + CRIT_LABELS[key] + '</td><td>' + data.scores[key] + ' / 5</td></tr>';
        total += data.scores[key]; count++;
      });
      const avg = count ? (total / count).toFixed(1) : '—';
      resultBox.style.display = '';
      resultBox.innerHTML =
        '<div class="result-status">Ocena gotowa</div>' +
        '<div class="result-detail">Recenzent: ' + escapeHtml(data.reviewerKsywa) + ' &middot; średnia: ' + avg + ' / 5</div>' +
        '<table class="score-table">' + rows + '</table>' +
        (data.comments ? '<div class="comments-block"><strong>Komentarz recenzenta:</strong><br>' + escapeHtml(data.comments) + '</div>' : '');
    }
  } catch(e) {
    status.className = 'status-note err';
    status.textContent = e.message || 'Błąd połączenia.';
  }
  btn.disabled = false; btn.textContent = 'Sprawdź ocenę →';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
