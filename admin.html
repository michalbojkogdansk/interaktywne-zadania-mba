<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://mba-quiz-proxy.michal-bojko-gdansk.workers.dev; frame-ancestors 'none';">
<title>MBA Platform — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F0EDE7; --card:#fff; --border:#D0CBC4; --accent:#4A8F8A; --text:#1a1a1a; --sec:#666; --danger:#c0392b; --ok:#2ecc71; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); font-family:Inter,sans-serif; color:var(--text); min-height:100vh; }

  #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-box { background:var(--card); border:1.5px solid var(--border); padding:48px 40px; max-width:420px; width:90%; }
  .login-box h1 { font-size:1.6rem; font-weight:800; margin-bottom:8px; }
  .badge-label { font-size:11px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:#9b8f84; margin-bottom:12px; }

  #main-screen { display:none; }
  .top-bar { background:var(--card); border-bottom:1.5px solid var(--border); padding:16px 32px; display:flex; justify-content:space-between; align-items:center; }
  .top-bar h1 { font-size:1.1rem; font-weight:800; }
  .container { max-width:1000px; margin:0 auto; padding:32px 24px; }

  .panel { background:var(--card); border:1.5px solid var(--border); margin-bottom:24px; }
  .panel-head { padding:20px 24px; border-bottom:1.5px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .panel-head h2 { font-size:1rem; font-weight:800; }
  .panel-body { padding:24px; }

  .field-label { display:block; font-size:0.82rem; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--sec); margin-bottom:6px; margin-top:16px; }
  .field-label:first-child { margin-top:0; }
  input[type="text"], input[type="date"], input[type="password"] {
    width:100%; padding:11px 13px; border:1.5px solid var(--border); font-size:0.95rem; font-family:Inter,sans-serif;
    background:#fff; outline:none; border-radius:0;
  }
  input:focus { border-color:var(--accent); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  /* Exercise checkboxes — grid of equal-width buttons */
  .ex-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 4px;
  }
  .ex-item {
    position: relative;
  }
  .ex-item input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }
  .ex-item label {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 9px 8px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--sec);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.1s, background 0.1s, color 0.1s;
    line-height: 1.3;
    min-height: 42px;
  }
  .ex-item input[type="checkbox"]:checked + label {
    border-color: var(--accent);
    background: #e8f4f3;
    color: var(--accent);
  }
  .ex-item label:hover {
    border-color: var(--accent);
  }
  .ex-toggle-all {
    font-size: 0.75rem; font-weight: 600; color: var(--accent);
    cursor: pointer; background: none; border: none;
    font-family: Inter, sans-serif; padding: 0;
    margin-top: 8px; display: inline-block; text-decoration: underline;
  }

  .btn { padding:11px 20px; font-size:0.9rem; font-weight:700; font-family:Inter,sans-serif; cursor:pointer; border:none; border-radius:0; letter-spacing:0.3px; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#3d7a75; }
  .btn-danger { background:#e74c3c; color:#fff; }
  .btn-danger:hover { background:#c0392b; }
  .btn-ghost { background:transparent; color:var(--text); border:1.5px solid var(--border); }
  .btn-ghost:hover { background:var(--bg); }
  .btn-sm { padding:7px 14px; font-size:0.82rem; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .groups-table { width:100%; border-collapse:collapse; font-size:0.88rem; }
  .groups-table th { text-align:left; padding:10px 14px; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--sec); border-bottom:1.5px solid var(--border); white-space:nowrap; }
  .groups-table td { padding:11px 14px; border-bottom:1px solid #ece8e2; vertical-align:middle; }
  .groups-table tr:last-child td { border-bottom:none; }
  .groups-table tr:hover td { background:#faf9f7; }

  .badge { display:inline-block; padding:3px 10px; font-size:0.72rem; font-weight:700; }
  .badge-active   { background:#e8f5f4; color:var(--accent); border:1px solid var(--accent); }
  .badge-inactive { background:#fef0f0; color:var(--danger); border:1px solid var(--danger); }
  .badge-future   { background:#fef9e7; color:#e67e22; border:1px solid #e67e22; }
  .badge-expired  { background:#f5f5f5; color:#999; border:1px solid #ccc; }

  .ex-pills { display:flex; gap:4px; flex-wrap:wrap; }
  .ex-pill { font-size:0.68rem; font-weight:700; padding:2px 7px; background:#e8f4f3; color:var(--accent); border:1px solid var(--accent); }
  .ex-pill-all { background:#f0f0f0; color:#666; border-color:#ccc; }

  .alert { padding:12px 16px; font-size:0.9rem; font-weight:500; margin-top:16px; }
  .alert-ok  { background:#e8f8f0; color:#1a7a4a; border-left:4px solid var(--ok); }
  .alert-err { background:#fef0f0; color:var(--danger); border-left:4px solid var(--danger); }

  .code-pill { background:var(--bg); border:1.5px solid var(--border); padding:4px 10px; font-family:monospace; font-size:0.85rem; font-weight:700; }
  .empty-state { text-align:center; padding:40px; color:var(--sec); font-size:0.95rem; }
  .logout-btn { font-size:0.82rem; color:var(--sec); cursor:pointer; background:none; border:none; font-family:Inter,sans-serif; }
  .logout-btn:hover { color:var(--text); }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#fff; border:1.5px solid var(--border); padding:32px; max-width:460px; width:90%; }
  .modal-box h3 { font-size:1.1rem; font-weight:800; margin-bottom:20px; }
  .modal-actions { display:flex; gap:12px; margin-top:24px; justify-content:flex-end; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <p class="badge-label">MBA Platform</p>
    <h1>Panel Administratora</h1>
    <p style="color:#666;margin-top:4px;margin-bottom:28px;font-size:0.95rem;">Wprowadź klucz administratora, aby kontynuować.</p>
    <span class="field-label">Klucz administratora</span>
    <input type="password" id="admin-key-input" placeholder="ADMIN-MBA-..." autocomplete="off"
      onkeydown="if(event.key==='Enter')doLogin();" />
    <div id="login-error" class="alert alert-err" style="display:none;"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="doLogin()">Zaloguj →</button>
  </div>
</div>

<div id="main-screen">
  <div class="top-bar">
    <h1>MBA Platform · Panel Administratora</h1>
    <button class="logout-btn" onclick="doLogout()">Wyloguj</button>
  </div>
  <div class="container">

    <div class="panel">
      <div class="panel-head"><h2>Nowa Grupa</h2></div>
      <div class="panel-body">
        <div class="form-row">
          <div>
            <span class="field-label">Nazwa grupy</span>
            <input type="text" id="new-name" placeholder="np. Zarządzanie Weekend A" />
          </div>
          <div>
            <span class="field-label">Hasło dostępu</span>
            <div style="position:relative;display:flex;align-items:center;">
              <input type="password" id="new-password" placeholder="np. MBA-ZWA-2026" autocomplete="new-password" style="width:100%;padding-right:44px;" />
              <button type="button" onclick="togglePassVis('new-password','pass-eye')"
                style="position:absolute;right:0;top:0;bottom:0;width:40px;background:none;border:none;cursor:pointer;font-size:16px;color:#666;" id="pass-eye">👁</button>
            </div>
          </div>
        </div>
        <div class="form-row" style="margin-top:16px;">
          <div>
            <span class="field-label">Data rozpoczęcia</span>
            <input type="date" id="new-start" />
          </div>
          <div>
            <span class="field-label">Data zakończenia dostępu</span>
            <input type="date" id="new-end" />
          </div>
        </div>
        <div style="margin-top:16px;">
          <span class="field-label">Dostęp do ćwiczeń</span>
          <div class="ex-grid" id="new-exercises">
            <div class="ex-item"><input type="checkbox" id="n01" value="01" checked><label for="n01">Ćw. 01 — Korelacja</label></div>
            <div class="ex-item"><input type="checkbox" id="n02" value="02" checked><label for="n02">Ćw. 02 — Myślenie krit.</label></div>
            <div class="ex-item"><input type="checkbox" id="n03" value="03" checked><label for="n03">Ćw. 03 — Transformacja</label></div>
            <div class="ex-item"><input type="checkbox" id="n04" value="04" checked><label for="n04">Ćw. 04 — Ciemne dane</label></div>
            <div class="ex-item"><input type="checkbox" id="n05" value="05" checked><label for="n05">Ćw. 05 — Inżynieria</label></div>
            <div class="ex-item"><input type="checkbox" id="ntest" value="test" checked><label for="ntest">Test końcowy</label></div>
          </div>
          <button class="ex-toggle-all" onclick="toggleAll('new-exercises')">zaznacz / odznacz wszystkie</button>
        </div>
        <div id="create-msg"></div>
        <button class="btn btn-primary" style="margin-top:20px;" onclick="createGroup()">Utwórz grupę →</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Grupy</h2>
        <button class="btn btn-ghost btn-sm" onclick="loadGroups()">↻ Odśwież</button>
      </div>
      <div class="panel-body" style="padding:0;">
        <div id="groups-container"><div class="empty-state">Ładowanie...</div></div>
      </div>
    </div>

  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <h3 id="edit-modal-title">Dostęp do ćwiczeń</h3>
    <div class="ex-grid" id="edit-exercises">
      <div class="ex-item"><input type="checkbox" id="e01" value="01"><label for="e01">Ćw. 01 — Korelacja</label></div>
      <div class="ex-item"><input type="checkbox" id="e02" value="02"><label for="e02">Ćw. 02 — Myślenie krit.</label></div>
      <div class="ex-item"><input type="checkbox" id="e03" value="03"><label for="e03">Ćw. 03 — Transformacja</label></div>
      <div class="ex-item"><input type="checkbox" id="e04" value="04"><label for="e04">Ćw. 04 — Ciemne dane</label></div>
      <div class="ex-item"><input type="checkbox" id="e05" value="05"><label for="e05">Ćw. 05 — Inżynieria</label></div>
      <div class="ex-item"><input type="checkbox" id="etest" value="test"><label for="etest">Test końcowy</label></div>
    </div>
    <button class="ex-toggle-all" onclick="toggleAll('edit-exercises')">zaznacz / odznacz wszystkie</button>
    <div id="edit-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Anuluj</button>
      <button class="btn btn-primary btn-sm" onclick="saveExercises()">Zapisz →</button>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://mba-quiz-proxy.michal-bojko-gdansk.workers.dev';
const ALL_EX = ['01','02','03','04','05','test'];
let ADMIN_KEY = '', _groups = [], _editIdx = null;

function togglePassVis(id, btnId) {
  const i = document.getElementById(id), b = document.getElementById(btnId);
  i.type = i.type === 'password' ? 'text' : 'password';
  b.textContent = i.type === 'password' ? '👁' : '🙈';
}

function toggleAll(containerId) {
  const cbs = document.querySelectorAll('#'+containerId+' input[type=checkbox]');
  const allChecked = Array.from(cbs).every(c => c.checked);
  cbs.forEach(c => { c.checked = !allChecked; });
}

function getSelected(containerId) {
  const cbs = document.querySelectorAll('#'+containerId+' input[type=checkbox]:checked');
  const vals = Array.from(cbs).map(c => c.value);
  return vals.length === ALL_EX.length ? null : vals;
}

function setSelected(containerId, allowed) {
  const cbs = document.querySelectorAll('#'+containerId+' input[type=checkbox]');
  cbs.forEach(cb => { cb.checked = allowed === null || allowed.includes(cb.value); });
}

function doLogin() {
  const key = document.getElementById('admin-key-input').value.trim();
  if (!key) return;
  ADMIN_KEY = key;
  loadGroups().then(ok => {
    if (ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
    } else {
      ADMIN_KEY = '';
      const el = document.getElementById('login-error');
      el.style.display = 'block'; el.textContent = 'Nieprawidłowy klucz administratora.';
    }
  });
}

function doLogout() {
  ADMIN_KEY = '';
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-key-input').value = '';
}

async function loadGroups() {
  try {
    const res = await fetch(WORKER+'/admin/list-groups', { headers: { 'X-Admin-Key': ADMIN_KEY } });
    if (!res.ok) return false;
    const data = await res.json();
    renderGroups(data.groups || []);
    return true;
  } catch(e) { return false; }
}

function getStatus(g) {
  const now = new Date(), s = new Date(g.startDate+'T00:00:00'), e = new Date(g.endDate+'T23:59:59');
  if (!g.active)  return { label:'Wyłączona', cls:'badge-inactive' };
  if (now < s)    return { label:'Przyszła',  cls:'badge-future'  };
  if (now > e)    return { label:'Wygasła',   cls:'badge-expired' };
  return { label:'Aktywna', cls:'badge-active' };
}

function maskPw(pw) {
  const p = pw.split('-');
  if (p.length >= 2) { p[p.length-1]='****'; return p.join('-'); }
  return '****';
}

function revealPw(idx) {
  const g = _groups[idx]; if (!g) return;
  const span = document.getElementById('pwd-'+idx), btn = document.getElementById('rbtn-'+idx);
  span.textContent = g.password; span.style.color = '#c0392b';
  btn.disabled = true; btn.textContent = '5s';
  let t = 5;
  const iv = setInterval(() => {
    if (--t <= 0) { clearInterval(iv); span.textContent=maskPw(g.password); span.style.color=''; btn.disabled=false; btn.textContent='Pokaż'; }
    else btn.textContent = t+'s';
  }, 1000);
}

function exPills(allowed) {
  if (allowed === null || allowed === undefined) return '<span class="ex-pill ex-pill-all">Wszystkie</span>';
  if (!allowed.length) return '<span style="color:#999;font-size:0.75rem;">Brak</span>';
  return allowed.map(ex => `<span class="ex-pill">${ex==='test'?'Test':'Ćw. '+ex}</span>`).join('');
}

function renderGroups(groups) {
  _groups = groups;
  const c = document.getElementById('groups-container');
  if (!groups.length) { c.innerHTML='<div class="empty-state">Brak grup.</div>'; return; }
  const order = {'Aktywna':0,'Przyszła':1,'Wyłączona':2,'Wygasła':3};
  groups.sort((a,b) => (order[getStatus(a).label]||9)-(order[getStatus(b).label]||9));
  let h = `<table class="groups-table"><thead><tr>
    <th>Nazwa</th><th>Hasło</th><th>Od</th><th>Do</th><th>Ćwiczenia</th><th>Status</th><th>Akcje</th>
  </tr></thead><tbody>`;
  groups.forEach((g,i) => {
    const st = getStatus(g);
    h += `<tr>
      <td><strong>${g.name}</strong></td>
      <td style="white-space:nowrap">
        <span class="code-pill" id="pwd-${i}">${maskPw(g.password)}</span>
        <button class="btn btn-ghost btn-sm" id="rbtn-${i}" onclick="revealPw(${i})" style="margin-left:6px;font-size:11px;padding:2px 8px;">Pokaż</button>
      </td>
      <td>${g.startDate}</td><td>${g.endDate}</td>
      <td><div class="ex-pills">${exPills(g.allowedExercises ?? null)}</div></td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td style="white-space:nowrap;display:flex;gap:6px;">
        <button class="btn btn-ghost btn-sm" onclick="openModal(${i})">Ćwiczenia</button>
        ${g.active
          ? `<button class="btn btn-ghost btn-sm" onclick="toggleGroup(${i},false)">Wyłącz</button>`
          : `<button class="btn btn-primary btn-sm" onclick="toggleGroup(${i},true)">Włącz</button>`}
        <button class="btn btn-danger btn-sm" onclick="deleteGroup(${i})">Usuń</button>
      </td>
    </tr>`;
  });
  h += '</tbody></table>';
  c.innerHTML = h;
}

async function createGroup() {
  const name=document.getElementById('new-name').value.trim();
  const pass=document.getElementById('new-password').value.trim();
  const start=document.getElementById('new-start').value;
  const end=document.getElementById('new-end').value;
  const msg=document.getElementById('create-msg');
  const allowedExercises=getSelected('new-exercises');
  if (!name||!pass||!start||!end) { msg.innerHTML='<div class="alert alert-err">Wypełnij wszystkie pola.</div>'; return; }
  if (end<start) { msg.innerHTML='<div class="alert alert-err">Data zakończenia musi być późniejsza.</div>'; return; }
  try {
    const res = await fetch(WORKER+'/admin/create-group',{
      method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY},
      body:JSON.stringify({name,password:pass,startDate:start,endDate:end,allowedExercises})
    });
    const data=await res.json();
    if (data.success) {
      msg.innerHTML=`<div class="alert alert-ok">✓ Grupa "${name}" utworzona.</div>`;
      document.getElementById('new-name').value='';
      document.getElementById('new-password').value='';
      loadGroups();
    } else {
      msg.innerHTML=`<div class="alert alert-err">${data.error||'Błąd.'}</div>`;
    }
  } catch(e) { msg.innerHTML='<div class="alert alert-err">Błąd połączenia.</div>'; }
}

async function toggleGroup(idx,active) {
  const g=_groups[idx]; if (!g) return;
  try {
    await fetch(WORKER+'/admin/toggle-group',{
      method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY},
      body:JSON.stringify({password:g.password,active})
    });
    loadGroups();
  } catch(e){alert('Błąd połączenia.');}
}

async function deleteGroup(idx) {
  const g=_groups[idx]; if (!g) return;
  const typed=prompt(`Aby potwierdzić usunięcie grupy "${g.name}", wpisz jej nazwę:`);
  if (typed===null) return;
  if (typed.trim()!==g.name){alert('Nazwa nie zgadza się.');return;}
  try {
    const res=await fetch(WORKER+'/admin/delete-group',{
      method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY},
      body:JSON.stringify({password:g.password,confirm_name:typed.trim()})
    });
    const data=await res.json();
    if (!res.ok){alert('Błąd: '+(data.error||res.status));return;}
    loadGroups();
  } catch(e){alert('Błąd połączenia.');}
}

function openModal(idx) {
  _editIdx=idx;
  const g=_groups[idx];
  document.getElementById('edit-modal-title').textContent='Dostęp do ćwiczeń — '+g.name;
  setSelected('edit-exercises', g.allowedExercises??null);
  document.getElementById('edit-msg').innerHTML='';
  document.getElementById('edit-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
  _editIdx=null;
}

async function saveExercises() {
  if (_editIdx===null) return;
  const g=_groups[_editIdx];
  const allowedExercises=getSelected('edit-exercises');
  const msg=document.getElementById('edit-msg');
  try {
    const res=await fetch(WORKER+'/admin/update-group',{
      method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY},
      body:JSON.stringify({password:g.password,allowedExercises})
    });
    const data=await res.json();
    if (data.success){closeModal();loadGroups();}
    else msg.innerHTML=`<div class="alert alert-err" style="margin-top:12px;">${data.error||'Błąd.'}</div>`;
  } catch(e){msg.innerHTML='<div class="alert alert-err" style="margin-top:12px;">Błąd połączenia.</div>';}
}

document.getElementById('edit-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

window.addEventListener('load',()=>{
  const today=new Date(), later=new Date(today);
  later.setDate(later.getDate()+21);
  const fmt=d=>d.toISOString().slice(0,10);
  document.getElementById('new-start').value=fmt(today);
  document.getElementById('new-end').value=fmt(later);
});
</script>
</body>
</html>
